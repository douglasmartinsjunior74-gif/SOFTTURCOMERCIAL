function ModulosPage({onBack}){
  const [modulos,setMods]=React.useState([]);
  const [descs,setDescs]=React.useState({});
  const [modal,setModal]=React.useState(null);
  const [idx,setIdx]=React.useState(null);
  const [form,setForm]=React.useState({nome:"",desc:""});
  const [search,setSearch]=React.useState("");
  const [err,setErr]=React.useState("");
  React.useEffect(()=>{
    db.get("modulos_custom").then(v=>setMods(v||[...MODULOS])).catch(()=>setMods([...MODULOS]));
    db.get("modulos_desc").then(v=>setDescs(v||{})).catch(()=>{});
  },[]);
  const saveMods=list=>{setMods(list);db.set("modulos_custom",list);};
  const saveDescs=d=>{setDescs(d);db.set("modulos_desc",d);};
  const filtered=modulos.filter(m=>!search||m.toLowerCase().includes(search.toLowerCase()));
  const comDesc=modulos.filter(m=>descs[m]&&descs[m].trim()).length;
  function addMod(){
    const nome=form.nome.trim();
    if(!nome){setErr("Informe o nome.");return;}
    if(modulos.includes(nome)){setErr("Módulo já existe.");return;}
    saveMods([...modulos,nome]);
    if(form.desc.trim())saveDescs({...descs,[nome]:form.desc.trim()});
    setModal(null);setForm({nome:"",desc:""});setErr("");
  }
  function editMod(){
    const nome=form.nome.trim();
    if(!nome){setErr("Informe o nome.");return;}
    const old=modulos[idx];
    if(nome!==old&&modulos.includes(nome)){setErr("Já existe.");return;}
    const list=[...modulos];list[idx]=nome;
    if(old!==nome&&descs[old]){const d={...descs,[nome]:descs[old]};delete d[old];saveDescs(d);}
    saveMods(list);setModal(null);setForm({nome:"",desc:""});setIdx(null);setErr("");
  }
  function saveDesc(){
    saveDescs({...descs,[modulos[idx]]:form.desc});
    setModal(null);setForm({nome:"",desc:""});setIdx(null);
  }
  function delMod(i){if(!confirm("Remover '"+modulos[i]+"'?"))return;saveMods(modulos.filter((_,j)=>j!==i));}
  return <div style={{padding:"1rem 0"}}>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:"1.5rem",flexWrap:"wrap"}}>
      <button style={bG} onClick={onBack}><i className="ti ti-arrow-left"/> Voltar</button>
      <div style={{flex:1}}><p style={{fontWeight:600,fontSize:15,margin:0}}>Gerenciar módulos</p><p style={{fontSize:12,color:"#9CA3AF",margin:0}}>{comDesc} de {modulos.length} módulos com descrição</p></div>
      <button style={{...bG,fontSize:12,padding:"7px 12px"}} onClick={()=>{if(confirm("Restaurar lista padrão?"))saveMods([...MODULOS]);}}><i className="ti ti-refresh" style={{marginRight:5}}/>Restaurar padrão</button>
      <button style={bR} onClick={()=>{setForm({nome:"",desc:""});setErr("");setModal("add");}}><i className="ti ti-plus" style={{marginRight:6}}/>Novo módulo</button>
    </div>
    <div style={{background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:8,padding:"10px 14px",marginBottom:"1rem",display:"flex",gap:8,alignItems:"flex-start"}}>
      <i className="ti ti-info-circle" style={{color:"#185FA5",fontSize:16,flexShrink:0,marginTop:1}}/>
      <p style={{fontSize:12,color:"#1D4ED8",margin:0,lineHeight:1.6}}>Adicione descrições para cada módulo. Elas aparecem na proposta comercial ao detalhar os itens contratados.</p>
    </div>
    <input style={{...inp,marginBottom:"1rem"}} placeholder="Buscar módulo..." value={search} onChange={e=>setSearch(e.target.value)}/>
    <div style={{background:"#fff",border:"1px solid #E5E7EB",borderRadius:12,overflow:"hidden"}}>
      {filtered.length===0?<p style={{fontSize:13,color:"#9CA3AF",textAlign:"center",padding:"2rem 0"}}>Nenhum módulo encontrado.</p>
      :filtered.map((m,i)=>{
        const ri=modulos.indexOf(m);
        const desc=descs[m]||"";
        return <div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 16px",borderTop:i===0?"none":"1px solid #F9FAFB"}}>
          <div style={{width:10,height:10,borderRadius:"50%",background:desc?"#16A34A":"#E5E7EB",flexShrink:0}}/>
          <div style={{flex:1,minWidth:0}}>
            <p style={{fontSize:13,fontWeight:500,color:"#374151",margin:0}}>{m}</p>
            {desc&&<p style={{fontSize:11,color:"#6B7280",margin:"2px 0 0",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:"90%"}}>{desc}</p>}
          </div>
          <div style={{display:"flex",gap:5,flexShrink:0}}>
            <button onClick={()=>{setIdx(ri);setForm({nome:"",desc:desc});setModal("desc");}} style={{border:"1px solid #E5E7EB",background:desc?"#ECFDF5":"#F9FAFB",color:desc?"#16A34A":"#6B7280",borderRadius:20,padding:"3px 12px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>{desc?"✓ Descrição":"+ Descrição"}</button>
            <button style={{...bG,padding:"5px 10px",fontSize:12}} title="Editar nome" onClick={()=>{setIdx(ri);setForm({nome:m,desc:""});setErr("");setModal("edit");}}><i className="ti ti-edit"/></button>
            <button style={{...bG,padding:"5px 10px",fontSize:12,color:"#C91B1B"}} title="Remover" onClick={()=>delMod(ri)}><i className="ti ti-trash"/></button>
          </div>
        </div>;
      })}
    </div>
    {modal==="add"&&<Modal title="Novo módulo" onClose={()=>{setModal(null);setForm({nome:"",desc:""});setErr("");}}>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <div><label style={{fontSize:11,fontWeight:600,color:"#6B7280",display:"block",marginBottom:4,textTransform:"uppercase"}}>Nome *</label><input style={inp} placeholder="Ex: Sistema base..." value={form.nome} onChange={e=>setForm(p=>({...p,nome:e.target.value}))} autoFocus/></div>
        <div><label style={{fontSize:11,fontWeight:600,color:"#6B7280",display:"block",marginBottom:4,textTransform:"uppercase"}}>Descrição (opcional)</label><textarea style={{...inp,minHeight:80,resize:"vertical",lineHeight:1.5}} placeholder="Descreva os recursos deste módulo..." value={form.desc} onChange={e=>setForm(p=>({...p,desc:e.target.value}))}/></div>
        {err&&<p style={{fontSize:12,color:"#C91B1B",margin:0}}>{err}</p>}
        <div style={{display:"flex",gap:8}}><button style={{...bG,flex:1}} onClick={()=>{setModal(null);setForm({nome:"",desc:""});setErr("");}}>Cancelar</button><button style={{...bR,flex:2}} onClick={addMod}>Adicionar</button></div>
      </div>
    </Modal>}
    {modal==="edit"&&<Modal title={"Editar: "+modulos[idx]} onClose={()=>{setModal(null);setForm({nome:"",desc:""});setIdx(null);setErr("");}}>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <div><label style={{fontSize:11,fontWeight:600,color:"#6B7280",display:"block",marginBottom:4,textTransform:"uppercase"}}>Nome *</label><input style={inp} value={form.nome} onChange={e=>setForm(p=>({...p,nome:e.target.value}))} autoFocus/></div>
        {err&&<p style={{fontSize:12,color:"#C91B1B",margin:0}}>{err}</p>}
        <div style={{display:"flex",gap:8}}><button style={{...bG,flex:1}} onClick={()=>{setModal(null);setForm({nome:"",desc:""});setIdx(null);setErr("");}}>Cancelar</button><button style={{...bR,flex:2}} onClick={editMod}>Salvar nome</button></div>
      </div>
    </Modal>}
    {modal==="desc"&&<Modal title={"Descrição: "+(modulos[idx]||"")} onClose={()=>{setModal(null);setForm({nome:"",desc:""});setIdx(null);}}>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <p style={{fontSize:12,color:"#6B7280",margin:0,lineHeight:1.6}}>Esta descrição aparece na proposta comercial ao lado do módulo contratado.</p>
        <textarea style={{...inp,minHeight:100,resize:"vertical",lineHeight:1.6}} autoFocus placeholder="Descreva os recursos e benefícios..." value={form.desc} onChange={e=>setForm(p=>({...p,desc:e.target.value}))}/>
        <div style={{display:"flex",gap:8}}>
          <button style={{...bG,flex:1}} onClick={()=>{setModal(null);setForm({nome:"",desc:""});setIdx(null);}}>Cancelar</button>
          {descs[modulos[idx]]&&<button style={{...bG,flex:1,color:"#C91B1B"}} onClick={()=>{const d={...descs};delete d[modulos[idx]];saveDescs(d);setModal(null);setForm({nome:"",desc:""});setIdx(null);}}>Remover</button>}
          <button style={{...bR,flex:2}} onClick={saveDesc}>Salvar</button>
        </div>
      </div>
    </Modal>}
  </div>;
}


// AzurePage
const PIPELINE_COLS = [
  {id:"New",label:"New",color:"#6B7280",bg:"#F3F4F6",icon:"ti-point"},
  {id:"Analise",label:"Análise",color:"#185FA5",bg:"#E6F1FB",icon:"ti-search"},
  {id:"Desenvolvimento",label:"Dev",color:"#534AB7",bg:"#EEEDFE",icon:"ti-code"},
  {id:"Teste",label:"Teste",color:"#BA7517",bg:"#FAEEDA",icon:"ti-flask"},
  {id:"Merge",label:"Merge",color:"#0F6E56",bg:"#E1F5EE",icon:"ti-git-merge"},
  {id:"Deploy",label:"Deploy",color:"#C91B1B",bg:"#FEF2F2",icon:"ti-rocket"},
];
const AZ_BOARDS=[
  {id:"suporte",label:"Suporte",color:"#185FA5",icon:"ti-headset"},
  {id:"evolutivo",label:"Evolutivo",color:"#534AB7",icon:"ti-trending-up"},
  {id:"ecommerce",label:"E-commerce",color:"#0F6E56",icon:"ti-shopping-cart"},
];
function AzurePage(props){
  var session=props.session; var onBack=props.onBack;
  var [cfg,setCfg]=React.useState({org:"",pat:"",projects:{suporte:"",evolutivo:"",ecommerce:""}});
  var [cards,setCards]=React.useState([]);
  var [loading,setLoading]=React.useState(false);
  var [err,setErr]=React.useState("");
  var [lastSync,setLastSync]=React.useState(null);
  var [showCfg,setShowCfg]=React.useState(false);
  var [cfgLoaded,setCfgLoaded]=React.useState(false);
  var [search,setSearch]=React.useState("");
  var [filterTag,setFilterTag]=React.useState("");
  var [filterBoard,setFilterBoard]=React.useState("");
  var [viewMode,setViewMode]=React.useState("kanban");
  var [tagDropOpen,setTagDropOpen]=React.useState(false);
  var [tagSearch,setTagSearch]=React.useState("");
  React.useEffect(function(){
    db.get("azure_cfg").then(function(v){
      if(v){
        // migrate old single-project format
        if(v.project&&!(v.projects&&(v.projects.suporte||v.projects.evolutivo||v.projects.ecommerce))){
          var m=Object.assign({},v,{projects:{suporte:v.project,evolutivo:"",ecommerce:""}});
          setCfg(m);
          db.set("azure_cfg",m).catch(function(){});
        } else {
          setCfg(v);
        }
      } else {setShowCfg(true);}
      setCfgLoaded(true);
    }).catch(function(){setShowCfg(true);setCfgLoaded(true);});
    db.get("azure_cards").then(function(v){if(v)setCards(v);}).catch(function(){});
    db.get("azure_sync").then(function(v){if(v)setLastSync(v);}).catch(function(){});
  },[]);
  React.useEffect(function(){
    if(!tagDropOpen)return;
    function handler(e){if(!e.target.closest(".az-tag-drop"))setTagDropOpen(false);}
    document.addEventListener("mousedown",handler);
    return function(){document.removeEventListener("mousedown",handler);};
  },[tagDropOpen]);
  function getColCards(colId){
    if(colId==="Analise") return filtered.filter(function(c){return c.state==="Analise"||c.state==="Análise";});
    return filtered.filter(function(c){return c.state===colId;});
  }
  var allTags=[...new Set(cards.flatMap(function(c){return (c.tags||"").split(";").map(function(t){return t.trim();}).filter(Boolean);}))].sort();
  var filteredTags=tagSearch?allTags.filter(function(t){return t.toLowerCase().includes(tagSearch.toLowerCase());}):allTags;
  var tagCount=function(tag){return cards.filter(function(c){return(c.tags||"").split(";").map(function(t){return t.trim();}).includes(tag);}).length;};
  var filtered=cards.filter(function(c){
    var matchSearch=!search||(c.title||"").toLowerCase().includes(search.toLowerCase())||(c.assigned||"").toLowerCase().includes(search.toLowerCase());
    var matchTag=!filterTag||(c.tags||"").split(";").map(function(t){return t.trim();}).includes(filterTag);
    var matchBoard=!filterBoard||c.board===filterBoard;
    return matchSearch&&matchTag&&matchBoard;
  });
  async function buscar(){
    // backward compat: if old single-project cfg (cfg.project), migrate it to projects.suporte
    if(cfg.project&&!(cfg.projects&&(cfg.projects.suporte||cfg.projects.evolutivo||cfg.projects.ecommerce))){
      var migratedCfg=Object.assign({},cfg,{projects:{suporte:cfg.project,evolutivo:"",ecommerce:""}});
      setCfg(migratedCfg);
      db.set("azure_cfg",migratedCfg).catch(function(){});
    }
    var resolvedProjects=(cfg.projects&&Object.values(cfg.projects).filter(Boolean).length>0)?cfg.projects:(cfg.project?{suporte:cfg.project,evolutivo:"",ecommerce:""}:{});
    var boards=AZ_BOARDS.filter(function(b){return resolvedProjects[b.id];});
    if(!cfg.org||!cfg.pat||boards.length===0){setErr("Preencha organização, PAT e ao menos um projeto.");return;}
    setLoading(true);setErr("");
    try{
      var results=await Promise.all(boards.map(async function(b){
        var res=await fetch("/.netlify/functions/azure-proxy",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({org:cfg.org,project:resolvedProjects[b.id],pat:cfg.pat})});
        if(!res.ok){var ed=await res.json().catch(function(){return{};});throw new Error((ed.error||"Erro "+res.status)+" ("+b.label+")");}
        var list=await res.json();
        if(!Array.isArray(list))throw new Error((list.error||"Erro inesperado")+" ("+b.label+")");
        return list.map(function(c){return Object.assign({},c,{board:b.id,boardLabel:b.label});});
      }));
      var all=results.flat();
      var ts=new Date().toLocaleString("pt-BR");
      setCards(all);setLastSync(ts);
      await db.set("azure_cards",all);await db.set("azure_sync",ts);await db.set("azure_cfg",cfg);
      setShowCfg(false);
    }catch(e){setErr("Erro: "+e.message);}
    setLoading(false);
  }
  return <div style={{padding:"1rem 0"}}>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:"1.25rem",flexWrap:"wrap"}}>
      <button style={bG} onClick={onBack}><i className="ti ti-arrow-left"/> Voltar</button>
      <div style={{flex:1}}>
        <p style={{fontWeight:600,fontSize:15,margin:0}}><i className="ti ti-brand-azure" style={{marginRight:7,color:"#0078D4"}}/>Azure DevOps — Pipeline</p>
        <p style={{fontSize:11,color:"#9CA3AF",margin:0}}>{lastSync?"Sync: "+lastSync:"Nunca sincronizado"}{cards.length>0&&<span> · {cards.length} cards · {filtered.length} exibidos</span>}</p>
      </div>
      <button style={{...bG,padding:"7px 10px",background:viewMode==="kanban"?"#EFF6FF":"transparent",color:viewMode==="kanban"?"#0078D4":"#374151"}} onClick={function(){setViewMode("kanban");}} title="Kanban"><i className="ti ti-layout-columns"/></button>
      <button style={{...bG,padding:"7px 10px",background:viewMode==="lista"?"#EFF6FF":"transparent",color:viewMode==="lista"?"#0078D4":"#374151"}} onClick={function(){setViewMode("lista");}} title="Lista"><i className="ti ti-list"/></button>
      <button style={{...bG,padding:"7px 10px"}} onClick={function(){setShowCfg(!showCfg);}}><i className="ti ti-settings"/></button>
      <button style={{...bG,borderColor:"#0078D4",color:"#0078D4",background:(loading||!cfgLoaded)?"#f0f0f0":"transparent"}} onClick={buscar} disabled={loading||!cfgLoaded}>
        <i className={"ti "+(loading?"ti-loader":"ti-refresh")} style={{marginRight:6}}/>{loading?"Buscando...":"Sincronizar"}
      </button>
    </div>
    {showCfg&&<div style={{background:"#fff",border:"1.5px solid #0078D4",borderRadius:12,padding:"1.25rem",marginBottom:"1.25rem"}}>
      <p style={{fontSize:13,fontWeight:600,color:"#0078D4",margin:"0 0 10px"}}>Configuração Azure DevOps</p>
      <div style={{background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:8,padding:"10px 14px",marginBottom:10,fontSize:12,color:"#1D4ED8"}}> Traz <strong>todos</strong> os cards nos estados: <strong>New, Análise, Dev, Teste, Merge, Deploy</strong>. Filtre por board ou tag na visualização.</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <div><label style={{fontSize:11,fontWeight:600,color:"#6B7280",display:"block",marginBottom:3,textTransform:"uppercase"}}>Organização</label><input style={inp} placeholder="ex: soft-ti" value={cfg.org} onChange={function(e){setCfg(function(p){return Object.assign({},p,{org:e.target.value});})}}/></div>
        <div><label style={{fontSize:11,fontWeight:600,color:"#6B7280",display:"block",marginBottom:3,textTransform:"uppercase"}}>PAT (Personal Access Token)</label><input style={inp} type="password" placeholder="Cole seu PAT aqui" value={cfg.pat} onChange={function(e){setCfg(function(p){return Object.assign({},p,{pat:e.target.value});})}}/></div>
      </div>
      <p style={{fontSize:11,fontWeight:600,color:"#6B7280",margin:"0 0 8px",textTransform:"uppercase",letterSpacing:".05em"}}>Projetos (Boards)</p>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:12}}>
        {AZ_BOARDS.map(function(b){return <div key={b.id} style={{background:"#F9FAFB",border:"1px solid #E5E7EB",borderRadius:8,padding:"10px 12px"}}>
          <label style={{fontSize:11,fontWeight:600,color:b.color,display:"flex",alignItems:"center",gap:4,marginBottom:5}}><i className={"ti "+b.icon}/>{b.label}</label>
          <input style={inp} placeholder={"Projeto "+b.label} value={(cfg.projects||{})[b.id]||""} onChange={function(e){var v=e.target.value;setCfg(function(p){var pr=Object.assign({},p.projects||{});pr[b.id]=v;return Object.assign({},p,{projects:pr});});}}/>
        </div>;})}
      </div>
      <p style={{fontSize:11,color:"#9CA3AF",marginBottom:10}}>Azure DevOps → User Settings → Personal Access Tokens → Work Items (Read)</p>
      {err&&<p style={{fontSize:12,color:"#C91B1B",marginBottom:10}}>{err}</p>}
      <button style={{...bG,borderColor:"#0078D4",color:"#0078D4",width:"100%",padding:"10px 0"}} onClick={buscar}>{loading?"Conectando...":"Conectar e buscar"}</button>
    </div>}
    {!showCfg&&err&&<p style={{fontSize:12,color:"#C91B1B",marginBottom:"1rem"}}>{err}</p>}
    {cards.length>0&&<>
      <div style={{display:"flex",gap:6,marginBottom:"1rem",flexWrap:"wrap",alignItems:"center"}}>
        <button onClick={function(){setFilterBoard("");}} style={{display:"flex",alignItems:"center",gap:5,border:"1.5px solid "+(filterBoard===""?"#0078D4":"#E5E7EB"),borderRadius:20,padding:"5px 14px",fontSize:12,fontWeight:filterBoard===""?600:400,background:filterBoard===""?"#EFF6FF":"#F9FAFB",color:filterBoard===""?"#0078D4":"#6B7280",cursor:"pointer",fontFamily:"'Inter',sans-serif"}}>
          <i className="ti ti-layout-grid" style={{fontSize:13}}/>Todos <span style={{opacity:.6,fontSize:11,marginLeft:2}}>({cards.length})</span>
        </button>
        {AZ_BOARDS.map(function(b){
          var n=cards.filter(function(c){return c.board===b.id;}).length;
          if(!n&&!(cfg.projects&&cfg.projects[b.id]))return null;
          return <button key={b.id} onClick={function(){setFilterBoard(filterBoard===b.id?"":b.id);}} style={{display:"flex",alignItems:"center",gap:5,border:"1.5px solid "+(filterBoard===b.id?b.color:"#E5E7EB"),borderRadius:20,padding:"5px 14px",fontSize:12,fontWeight:filterBoard===b.id?600:400,background:filterBoard===b.id?b.color+"18":"#F9FAFB",color:filterBoard===b.id?b.color:"#6B7280",cursor:"pointer",fontFamily:"'Inter',sans-serif"}}>
            <i className={"ti "+b.icon} style={{fontSize:13}}/>{b.label} <span style={{opacity:.6,fontSize:11,marginLeft:2}}>({n})</span>
          </button>;
        })}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:8,marginBottom:"1.25rem"}}>
        {PIPELINE_COLS.map(function(p){ var n=getColCards(p.id).length; return <div key={p.id} style={{background:p.bg,border:"1px solid "+p.color+"33",borderRadius:8,padding:"10px 8px",textAlign:"center"}}>
          <i className={"ti "+p.icon} style={{fontSize:18,color:p.color,display:"block",marginBottom:4}}/>
          <p style={{fontSize:20,fontWeight:700,color:p.color,margin:"0 0 2px"}}>{n}</p>
          <p style={{fontSize:10,color:p.color,margin:0,fontWeight:500}}>{p.label}</p>
        </div>;})}</div>
      <div style={{display:"flex",gap:8,marginBottom:"1rem",alignItems:"stretch",flexWrap:"wrap"}}>
        {allTags.length>0&&<div className="az-tag-drop" style={{position:"relative",flexShrink:0}}>
          <button onClick={function(){setTagDropOpen(!tagDropOpen);setTagSearch("");}} style={{display:"flex",alignItems:"center",gap:6,border:"1.5px solid "+(filterTag?"#0078D4":"#D1D5DB"),borderRadius:8,padding:"7px 12px",fontSize:12,fontWeight:filterTag?600:400,background:filterTag?"#EFF6FF":"#fff",color:filterTag?"#0078D4":"#6B7280",cursor:"pointer",minWidth:190,height:"100%",boxSizing:"border-box",justifyContent:"space-between",fontFamily:"'Inter',sans-serif"}}>
            <span style={{display:"flex",alignItems:"center",gap:5,overflow:"hidden"}}><i className="ti ti-tag" style={{fontSize:13,flexShrink:0}}/><span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{filterTag||"Filtrar por tag"}</span></span>
            <span style={{display:"flex",alignItems:"center",gap:4,flexShrink:0}}>
              {filterTag&&<span onClick={function(e){e.stopPropagation();setFilterTag("");}} style={{background:"#BFDBFE",color:"#1D4ED8",borderRadius:"50%",width:16,height:16,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,cursor:"pointer",lineHeight:1}}>✕</span>}
              <i className={"ti ti-chevron-"+(tagDropOpen?"up":"down")} style={{fontSize:12,opacity:.5}}/>
            </span>
          </button>
          {tagDropOpen&&<div style={{position:"absolute",top:"calc(100% + 4px)",left:0,zIndex:100,background:"#fff",border:"1.5px solid #E5E7EB",borderRadius:10,boxShadow:"0 8px 24px rgba(0,0,0,.13)",minWidth:260,maxHeight:340,overflow:"hidden",display:"flex",flexDirection:"column"}}>
            <div style={{padding:"8px 10px",borderBottom:"1px solid #F3F4F6"}}>
              <input autoFocus placeholder="Buscar tag..." value={tagSearch} onChange={function(e){setTagSearch(e.target.value);}} style={{...inp,margin:0,fontSize:12,padding:"6px 10px"}}/>
            </div>
            <div style={{overflowY:"auto",flex:1}}>
              <div onClick={function(){setFilterTag("");setTagDropOpen(false);}} style={{padding:"9px 14px",fontSize:12,cursor:"pointer",fontWeight:!filterTag?600:400,color:!filterTag?"#0078D4":"#374151",background:!filterTag?"#EFF6FF":"transparent",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{display:"flex",alignItems:"center",gap:6}}><i className="ti ti-apps" style={{fontSize:12,opacity:.6}}/>Todas as tags</span>
                <span style={{fontSize:11,color:"#9CA3AF",background:"#F3F4F6",borderRadius:10,padding:"1px 7px"}}>{cards.length}</span>
              </div>
              {filteredTags.map(function(tag){
                var n=tagCount(tag);
                return <div key={tag} onClick={function(){setFilterTag(tag);setTagDropOpen(false);}} style={{padding:"9px 14px",fontSize:12,cursor:"pointer",fontWeight:filterTag===tag?600:400,color:filterTag===tag?"#0078D4":"#374151",background:filterTag===tag?"#EFF6FF":"transparent",display:"flex",justifyContent:"space-between",alignItems:"center",borderTop:"1px solid #F9FAFB"}}>
                  <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginRight:8}}>{tag}</span>
                  <span style={{fontSize:11,color:"#9CA3AF",background:"#F3F4F6",borderRadius:10,padding:"1px 7px",flexShrink:0}}>{n}</span>
                </div>;
              })}
              {filteredTags.length===0&&<p style={{fontSize:12,color:"#9CA3AF",textAlign:"center",padding:"1rem 0"}}>Nenhuma tag encontrada</p>}
            </div>
          </div>}
        </div>}
        <input style={{...inp,flex:1,margin:0,minWidth:160}} placeholder="Buscar por título ou responsável..." value={search} onChange={function(e){setSearch(e.target.value);}}/>
      </div>
      {viewMode==="kanban"?
        <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:10}}>
          {PIPELINE_COLS.map(function(p){ var col=getColCards(p.id); return <div key={p.id}>
            <div style={{background:p.color,color:"#fff",borderRadius:"8px 8px 0 0",padding:"8px 10px",display:"flex",alignItems:"center",gap:6}}>
              <i className={"ti "+p.icon} style={{fontSize:13}}/>
              <span style={{fontSize:12,fontWeight:600}}>{p.label}</span>
              <span style={{marginLeft:"auto",background:"rgba(255,255,255,.25)",borderRadius:10,padding:"1px 7px",fontSize:11,fontWeight:700}}>{col.length}</span>
            </div>
            <div style={{background:"#F8FAFF",border:"1px solid "+p.color+"33",borderTop:"none",borderRadius:"0 0 8px 8px",minHeight:80,padding:6}}>
              {col.length===0?<p style={{fontSize:11,color:"#D1D5DB",textAlign:"center",padding:"12px 0"}}>Vazio</p>
              :col.map(function(c,i){
                var brd=AZ_BOARDS.find(function(b){return b.id===c.board;});
                return <div key={c.id||i} style={{background:"#fff",border:"1px solid #E5E7EB",borderRadius:6,padding:"8px 10px",marginBottom:6,boxShadow:"0 1px 3px rgba(0,0,0,.05)"}}>
                  {brd&&<span style={{fontSize:9,fontWeight:700,color:brd.color,background:brd.color+"18",borderRadius:10,padding:"1px 7px",display:"inline-block",marginBottom:4,letterSpacing:".03em"}}>{brd.label.toUpperCase()}</span>}
                  <p style={{fontSize:12,fontWeight:500,color:"#374151",margin:"0 0 5px",lineHeight:1.4}}>{c.title}</p>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:10,color:"#9CA3AF",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{c.assigned!=="—"?c.assigned:""}</span>
                    <a href={c.url} target="_blank" rel="noopener noreferrer" style={{fontSize:10,color:"#0078D4",textDecoration:"none",fontWeight:500,flexShrink:0}}>#{c.id}</a>
                  </div>
                </div>;})}
            </div>
          </div>;})}</div>
      :<div style={{background:"#fff",border:"1px solid #E5E7EB",borderRadius:12,overflow:"hidden"}}>
        {filtered.length===0?<p style={{fontSize:13,color:"#9CA3AF",textAlign:"center",padding:"2rem 0"}}>Nenhum card encontrado.</p>
        :filtered.map(function(c,i){
          var pi=PIPELINE_COLS.find(function(p){return p.id===c.state||((p.id==="Analise")&&c.state==="Análise");})||{label:c.state,color:"#6B7280",bg:"#F3F4F6",icon:"ti-point"};
          var brd=AZ_BOARDS.find(function(b){return b.id===c.board;});
          return <div key={c.id} style={{display:"flex",alignItems:"flex-start",gap:12,padding:"12px 16px",borderTop:i===0?"none":"1px solid #F9FAFB"}}>
            <div style={{width:36,height:36,borderRadius:8,background:pi.bg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><i className={"ti "+pi.icon} style={{fontSize:16,color:pi.color}}/></div>
            <div style={{flex:1}}>
              <div style={{display:"flex",justifyContent:"space-between",gap:8}}>
                <p style={{fontSize:14,fontWeight:500,color:"#374151",margin:"0 0 4px",flex:1}}>{c.title}</p>
                <a href={c.url} target="_blank" rel="noopener noreferrer" style={{fontSize:11,color:"#0078D4",textDecoration:"none",fontWeight:500,flexShrink:0}}>#{c.id}</a>
              </div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                <span style={{fontSize:11,fontWeight:600,background:pi.bg,color:pi.color,padding:"2px 8px",borderRadius:10}}>{pi.label}</span>
                {brd&&<span style={{fontSize:11,fontWeight:600,color:brd.color,background:brd.color+"18",padding:"2px 8px",borderRadius:10}}>{brd.label}</span>}
                {c.type&&<span style={{fontSize:11,color:"#9CA3AF",background:"#F3F4F6",padding:"2px 8px",borderRadius:10}}>{c.type}</span>}
                <span style={{fontSize:11,color:"#9CA3AF"}}>{c.assigned}</span>
                <span style={{fontSize:11,color:"#9CA3AF"}}>{c.changed}</span>
              </div>
            </div>
          </div>;
        })}
      </div>}
    </>}
    {cards.length===0&&!showCfg&&!loading&&<div style={{background:"#fff",border:"1px solid #E5E7EB",borderRadius:12,padding:"3rem",textAlign:"center"}}>
      <i className="ti ti-brand-azure" style={{fontSize:48,color:"#BFDBFE",display:"block",marginBottom:12}}/>
      <p style={{fontSize:14,fontWeight:500,color:"#374151",margin:"0 0 6px"}}>Nenhum card carregado</p>
      <p style={{fontSize:13,color:"#9CA3AF",margin:"0 0 16px"}}>Configure organização, PAT e projetos, depois clique em Sincronizar</p>
      <button style={{...bG,borderColor:"#0078D4",color:"#0078D4"}} onClick={function(){setShowCfg(true);}}>Configurar Azure</button>
    </div>}
  </div>;
}

          }).then(function(res){return res.json();})
            .then(function(d){resolve(d.url||null);})
            .catch(function(){resolve(null);});
        };
        r.readAsDataURL(file);
      });

// ErrorBoundary
class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={err:null};}
  static getDerivedStateFromError(e){return {err:e&&e.message?e.message:String(e)};}
  componentDidCatch(e,info){console.error("TomTicket erro:",e,info);}
  render(){
    if(this.state.err){
      return <div style={{padding:"2rem",textAlign:"center"}}>
        <i className="ti ti-alert-circle" style={{fontSize:40,color:"#C91B1B",display:"block",marginBottom:12}}/>
        <p style={{fontWeight:600,color:"#C91B1B",margin:"0 0 6px"}}>Erro no TomTicket</p>
        <p style={{fontSize:12,color:"#6B7280",margin:"0 0 16px",fontFamily:"monospace"}}>{this.state.err}</p>
        <button style={{...bG}} onClick={function(){window.location.reload();}}>Recarregar</button>
      </div>;
    }
    return this.props.children;
  }
}

function TomTicketPage(props){
  var onBack=props.onBack;
  var [tok,setTok]=React.useState("");
  var [allTickets,setAllTickets]=React.useState([]);
  var [orgTickets,setOrgTickets]=React.useState(null);
  var [orgs,setOrgs]=React.useState([]);
  var [customers,setCustomers]=React.useState([]);
  var [loading,setLoading]=React.useState(false);
  var [loadingOrg,setLoadingOrg]=React.useState(false);
  var [loadMsg,setLoadMsg]=React.useState("");
  var [err,setErr]=React.useState("");
  var [lastSync,setLastSync]=React.useState("");
  var [showCfg,setShowCfg]=React.useState(false);
  var [filterTab,setFilterTab]=React.useState("org");
  var [selOrg,setSelOrg]=React.useState(null);
  var [selCustomer,setSelCustomer]=React.useState(null);
  var [expandId,setExpandId]=React.useState(null);
  var [novoOpen,setNovoOpen]=React.useState(false);
  var [nfS,setNfS]=React.useState("");
  var [nfM,setNfM]=React.useState("");
  var [nfD,setNfD]=React.useState("");
  var [nfCust,setNfCust]=React.useState("");
  var [depts,setDepts]=React.useState([]);
  var [sending,setSending]=React.useState(false);
  var [sideSearch,setSideSearch]=React.useState("");
  var [ticketSearch,setTicketSearch]=React.useState("");

  React.useEffect(function(){
    try{db.get("tt_tok").then(function(v){if(v)setTok(v);}).catch(function(){});}catch(e){}
    try{db.get("tt_tks").then(function(v){if(v&&Array.isArray(v))setAllTickets(v);}).catch(function(){});}catch(e){}
    try{db.get("tt_orgs").then(function(v){if(v&&Array.isArray(v))setOrgs(v);}).catch(function(){});}catch(e){}
    try{db.get("tt_custs").then(function(v){if(v&&Array.isArray(v))setCustomers(v);}).catch(function(){});}catch(e){}
    try{db.get("tt_sync").then(function(v){if(v)setLastSync(v);}).catch(function(){});}catch(e){}
    try{db.get("tt_deps").then(function(v){if(v&&Array.isArray(v))setDepts(v);}).catch(function(){});}catch(e){}
  },[]);

  function getStr(v){
    if(!v&&v!==0)return "";
    if(typeof v==="object")return String(v.name||v.fantasia||v.razao_social||v.company||v.email||v.title||"");
    return String(v);
  }
  function getId(v){
    if(!v&&v!==0)return "";
    if(typeof v==="object")return String(v.id||"");
    return String(v);
  }
  function stripHtml(v){
    if(!v)return "";
    return String(v).replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/\s+/g," ").trim();
  }
  function getStatusNum(t){
    var raw=t.status||t.status_id||t.status_name||"";
    if(typeof raw==="number")return raw;
    if(typeof raw==="object"&&raw!==null){
      if(typeof raw.id==="number")return raw.id;
      var s2=(raw.name||"").toLowerCase();
      if(s2.indexOf("aberto")>=0||s2.indexOf("open")>=0)return 1;
      if(s2.indexOf("andamento")>=0||s2.indexOf("progress")>=0)return 2;
      if(s2.indexOf("aguard")>=0)return 3;
      if(s2.indexOf("finaliz")>=0||s2.indexOf("closed")>=0||s2.indexOf("resolv")>=0)return 4;
      return 0;
    }
    var n=Number(raw);
    return isNaN(n)?0:n;
  }
  function isFin(t){
    if(!t)return true;
    var num=getStatusNum(t);
    if(num===1||num===2||num===3)return false;
    if(num>=4)return true;
    var s=getStr(t.status||t.status_name||"").toLowerCase();
    if(!s)return false;
    return s.indexOf("finaliz")>=0||s.indexOf("cancel")>=0||s.indexOf("closed")>=0||s.indexOf("resolv")>=0||s.indexOf("encerr")>=0||s.indexOf("done")>=0||s.indexOf("conclui")>=0;
  }
  function cor(t){
    var num=getStatusNum(t);
    if(num===1)return {c:"#16A34A",bg:"#DCFCE7",label:"Aberto"};
    if(num===2)return {c:"#BA7517",bg:"#FAEEDA",label:"Em Andamento"};
    if(num===3)return {c:"#185FA5",bg:"#EFF6FF",label:"Aguardando"};
    var s=getStr(t.status||t.status_name||"").toLowerCase();
    if(s.indexOf("aberto")>=0||s.indexOf("open")>=0)return {c:"#16A34A",bg:"#DCFCE7",label:"Aberto"};
    if(s.indexOf("andamento")>=0||s.indexOf("progress")>=0)return {c:"#BA7517",bg:"#FAEEDA",label:"Em Andamento"};
    if(s.indexOf("aguard")>=0||s.indexOf("wait")>=0)return {c:"#185FA5",bg:"#EFF6FF",label:"Aguardando"};
    return {c:"#6B7280",bg:"#F3F4F6",label:"Ativo"};
  }

  function doAPI(ep,mt,ps,fa){
    return fetch("/.netlify/functions/tomticket-proxy",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token:tok,endpoint:ep,method:mt||"GET",params:ps||{},fetchAll:!!fa})
    }).then(function(r){if(!r.ok)return {error:true,message:"HTTP "+r.status};return r.json();});
  }
  function exTks(d){
    return Array.isArray(d&&d.data)?d.data:Array.isArray(d&&d.tickets)?d.tickets:Array.isArray(d)?d:[];
  }

  function doSync(){
    if(!tok){setErr("Configure o Token.");setShowCfg(true);return;}
    setLoading(true);setErr("");setLoadMsg("Buscando dados...");
    Promise.all([
      doAPI("organization/list","GET",{},true),
      doAPI("customer/list","GET",{},true),
      doAPI("ticket/list","GET",{},true),
      doAPI("department/category/list","GET",{},false)
    ]).then(function(res){
      var od=res[0],cd=res[1],td=res[2],dd=res[3];
      var tks=exTks(td);
      setAllTickets(tks);
      // Build org list
      var os=Array.isArray(od&&od.data)?od.data:Array.isArray(od)?od:[];
      var normalOrgs=os.map(function(o){return {id:String(o.id||""),name:getStr(o.name||o.razao_social||o.fantasia||o.company||o)||"Org "+o.id};}).filter(function(o){return o.id;});
      if(normalOrgs.length===0){var omap={};tks.forEach(function(t){var raw=t.organization||t.organization_id||t.account;var oid=getId(raw);if(oid&&!omap[oid])omap[oid]={id:oid,name:getStr(raw)||"Org "+oid};});normalOrgs=Object.values(omap);}
      setOrgs(normalOrgs);
      // Build customer list with orgId
      var cs=Array.isArray(cd&&cd.data)?cd.data:Array.isArray(cd&&cd.customers)?cd.customers:Array.isArray(cd)?cd:[];
      var custs=cs.map(function(c){
        var oid=getId(c.organization_id||c.organization||c.account_id||c.account||c.org_id||"");
        return {id:String(c.id||c.customer_id||""),name:getStr(c.name||c.nome||c.company||c)||"",email:getStr(c.email||""),orgId:oid};
      }).filter(function(c){return c.id;});
      setCustomers(custs);
      if(dd&&Array.isArray(dd.data))setDepts(dd.data);
      var ts=new Date().toLocaleString("pt-BR");
      setLastSync(ts);setLoading(false);setLoadMsg("");setShowCfg(false);
      setSelOrg(null);setSelCustomer(null);setOrgTickets(null);
      try{db.set("tt_tok",tok);db.set("tt_tks",tks);db.set("tt_orgs",normalOrgs);db.set("tt_custs",custs);db.set("tt_sync",ts);}catch(e){}
      if(dd&&Array.isArray(dd.data))try{db.set("tt_deps",dd.data);}catch(e){}
    }).catch(function(e){setErr("Erro: "+(e&&e.message?e.message:String(e)));setLoading(false);setLoadMsg("");});
  }

  // Select org: fetch customers of this org via API, then their tickets
  function selectOrg(org){
    if(!org){setSelOrg(null);setSelCustomer(null);setOrgTickets(null);setTicketSearch("");setExpandId(null);return;}
    setSelOrg(org);setSelCustomer(null);setTicketSearch("");setExpandId(null);
    setLoadingOrg(true);

    // Step 1: Fetch customers filtered by this org (try multiple params)
    Promise.all([
      doAPI("customer/list","GET",{account_id:org.id},true),
      doAPI("customer/list","GET",{organization_id:org.id},true)
    ]).then(function(res){
      var cs1=Array.isArray(res[0]&&res[0].data)?res[0].data:Array.isArray(res[0])?res[0]:[];
      var cs2=Array.isArray(res[1]&&res[1].data)?res[1].data:Array.isArray(res[1])?res[1]:[];
      var seenC={};var orgCusts=[];
      cs1.concat(cs2).forEach(function(c){var cid=String(c.id||c.customer_id||"");if(cid&&!seenC[cid]){seenC[cid]=true;orgCusts.push(cid);}});

      // Also use locally cached customers with orgId
      customers.forEach(function(c){if(String(c.orgId)===String(org.id)&&!seenC[c.id]){seenC[c.id]=true;orgCusts.push(c.id);}});

      if(orgCusts.length===0){
        // No customers found → show empty
        setOrgTickets([]);
        setLoadingOrg(false);
        return;
      }

      // Step 2: Fetch tickets for each customer (limit 15 customers)
      var promises=orgCusts.slice(0,15).map(function(cid){
        return doAPI("ticket/list","GET",{customer_id:cid},true).catch(function(){return {data:[]};});
      });

      Promise.all(promises).then(function(results){
        var seen={};var merged=[];
        results.forEach(function(d){
          exTks(d).forEach(function(t){
            var tid=String(t.ticket_id||t.id||"");
            if(tid&&!seen[tid]){seen[tid]=true;merged.push(t);}
          });
        });
        var active=merged.filter(function(t){return t&&!isFin(t);});
        setOrgTickets(active);
        setLoadingOrg(false);
      }).catch(function(){setOrgTickets([]);setLoadingOrg(false);});

    }).catch(function(){setOrgTickets([]);setLoadingOrg(false);});
  }

  function selectCustomer(cust){
    if(!cust){setSelCustomer(null);if(!selOrg)setOrgTickets(null);setTicketSearch("");setExpandId(null);return;}
    setSelCustomer(cust);setTicketSearch("");setExpandId(null);
    setLoadingOrg(true);
    doAPI("ticket/list","GET",{customer_id:cust.id},true).then(function(d){
      var tks=exTks(d).filter(function(t){return t&&!isFin(t);});
      setOrgTickets(tks);setLoadingOrg(false);
    }).catch(function(){setOrgTickets([]);setLoadingOrg(false);});
  }

  function doNovo(){
    if(!nfS||!nfM||!nfD||!nfCust){setErr("Preencha todos os campos.");return;}
    setSending(true);setErr("");
    doAPI("ticket/new","POST",{subject:nfS,message:nfM,department_id:nfD,customer_id:nfCust,customer_id_type:"I"},false).then(function(d){
      if(!d||d.error){setErr("Erro: "+(d&&d.message?d.message:"Falha"));setSending(false);return;}
      setNovoOpen(false);setNfS("");setNfM("");setNfD("");setNfCust("");doSync();setSending(false);
    }).catch(function(e){setErr(e&&e.message?e.message:String(e));setSending(false);});
  }

  var baseTickets=orgTickets!==null?orgTickets:allTickets.filter(function(t){return t&&!isFin(t);});
  var lst=baseTickets.filter(function(t){
    if(!ticketSearch)return true;
    return stripHtml(t.subject||t.title||"").toLowerCase().indexOf(ticketSearch.toLowerCase())>=0;
  });
  var atv_all=allTickets.filter(function(t){return t&&!isFin(t);});
  var filterLabel=selCustomer?selCustomer.name:(selOrg?selOrg.name:"Todos os chamados");
  var sideOrgs=orgs.filter(function(o){return !sideSearch||o.name.toLowerCase().indexOf(sideSearch.toLowerCase())>=0;});
  var sideCusts=customers.filter(function(c){
    var ms=!sideSearch||(c.name.toLowerCase().indexOf(sideSearch.toLowerCase())>=0)||(c.email&&c.email.toLowerCase().indexOf(sideSearch.toLowerCase())>=0);
    return ms;
  });

      <button style={bG} onClick={onBack}><i className="ti ti-arrow-left"/> Voltar</button>
      <div style={{flex:1}}>
        <p style={{fontWeight:600,fontSize:15,margin:0}}><i className="ti ti-ticket" style={{color:"#7C3AED",marginRight:6}}/>TomTicket — Chamados Ativos</p>
        <p style={{fontSize:11,color:"#9CA3AF",margin:0}}>{lastSync?"Sync: "+lastSync:"Nunca sincronizado"}{orgs.length>0?" · "+orgs.length+" org(s)":""}{customers.length>0?" · "+customers.length+" cliente(s)":""}{atv_all.length>0?" · "+atv_all.length+" ativo(s)":""}</p>
      </div>
      <button style={{...bG,padding:"7px 10px"}} onClick={function(){setShowCfg(!showCfg);}}><i className="ti ti-settings"/></button>
      <button style={{...bG,borderColor:"#7C3AED",color:"#7C3AED",background:"#F5F3FF"}} onClick={function(){setNovoOpen(true);setErr("");}}>
        <i className="ti ti-plus" style={{marginRight:5}}/>Novo Chamado
      </button>
      <button style={{...bG,borderColor:"#7C3AED",color:"#7C3AED"}} onClick={doSync} disabled={loading}>
        <i className={"ti "+(loading?"ti-loader":"ti-refresh")} style={{marginRight:5}}/>{loading?"Buscando...":"Sincronizar"}
      </button>
    </div>

    {loading?<div style={{background:"#F5F3FF",border:"1px solid #DDD6FE",borderRadius:8,padding:"10px 14px",marginBottom:"1rem",display:"flex",alignItems:"center",gap:10}}>
      <i className="ti ti-loader" style={{color:"#7C3AED",fontSize:18}}/><p style={{fontSize:13,fontWeight:500,color:"#7C3AED",margin:0}}>{loadMsg||"Sincronizando..."}</p>
    </div>:null}
    {showCfg?<div style={{background:"#fff",border:"1.5px solid #7C3AED",borderRadius:10,padding:"1rem",marginBottom:"1rem"}}>
      <p style={{fontWeight:600,color:"#7C3AED",fontSize:13,margin:"0 0 6px"}}>Token TomTicket API v2.0</p>
      <p style={{fontSize:11,color:"#6B7280",margin:"0 0 8px"}}>Gere em: TomTicket - Configuracoes - API - Tokens de Acesso</p>
      <input style={inp} type="password" placeholder="Bearer Token" value={tok} onChange={function(e){setTok(e.target.value);}}/>
      {err?<p style={{fontSize:12,color:"#C91B1B",margin:"6px 0"}}>{err}</p>:null}
      <button style={{...bG,borderColor:"#7C3AED",color:"#7C3AED",width:"100%",marginTop:8,padding:"10px 0"}} onClick={doSync}>{loading?"Buscando...":"Conectar e sincronizar"}</button>
    </div>:null}
    {!showCfg&&!loading&&err?<p style={{fontSize:12,color:"#C91B1B",marginBottom:"1rem"}}>{err}</p>:null}

    {orgs.length===0&&customers.length===0&&!showCfg&&!loading?<div style={{background:"#fff",border:"1px solid #E5E7EB",borderRadius:10,padding:"3rem",textAlign:"center"}}>

          </div>
        </div>
        <div style={{padding:"6px 6px 0"}}>
          <input style={{...inp,fontSize:12,padding:"7px 10px"}} placeholder="Buscar..." value={sideSearch} onChange={function(e){setSideSearch(e.target.value);}}/>
        </div>
        <div style={{maxHeight:"70vh",overflowY:"auto",padding:"4px 6px 6px"}}>
          <button onClick={function(){selectOrg(null);setSideSearch("");}}
            style={{width:"100%",textAlign:"left",border:"none",borderRadius:8,padding:"9px 12px",marginBottom:2,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",background:(!selOrg&&!selCustomer)?"#F5F3FF":"transparent"}}>
            <span style={{display:"flex",alignItems:"center",gap:7,fontSize:13,fontWeight:(!selOrg&&!selCustomer)?700:500,color:(!selOrg&&!selCustomer)?"#7C3AED":"#374151"}}>
              <div style={{width:28,height:28,borderRadius:7,background:(!selOrg&&!selCustomer)?"#7C3AED":"#E9D5FF",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                <i className="ti ti-list" style={{fontSize:12,color:(!selOrg&&!selCustomer)?"#fff":"#7C3AED"}}/>
              </div>Selecionar todos
            </span>
            <span style={{background:(!selOrg&&!selCustomer)?"#7C3AED":"#E9D5FF",color:(!selOrg&&!selCustomer)?"#fff":"#7C3AED",borderRadius:10,padding:"2px 7px",fontSize:11,fontWeight:700}}>{atv_all.length}</span>
          </button>

          {filterTab==="org"?sideOrgs.map(function(o,oi){
            var sel=selOrg&&String(selOrg.id)===String(o.id);
            return <button key={oi} onClick={function(){selectOrg(sel?null:o);}}
              style={{width:"100%",textAlign:"left",border:"none",borderRadius:8,padding:"9px 12px",marginBottom:2,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",background:sel?"#F5F3FF":"transparent"}}>
              <span style={{display:"flex",alignItems:"center",gap:7,minWidth:0,flex:1}}>

                  <span style={{fontSize:11,fontWeight:700,color:sel?"#fff":"#7C3AED"}}>{o.name.charAt(0).toUpperCase()}</span>

                <span style={{fontSize:12,fontWeight:sel?700:400,color:sel?"#7C3AED":"#374151",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.name}</span>
              </span>

            </button>;

                  <span style={{fontSize:11,fontWeight:700,color:sel?"#fff":"#7C3AED"}}>{c.name.charAt(0).toUpperCase()}</span>
                </div>
                <div style={{minWidth:0,flex:1}}>
                  <p style={{fontSize:12,fontWeight:sel?700:400,color:sel?"#7C3AED":"#374151",margin:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}</p>
                  {c.email?<p style={{fontSize:10,color:"#9CA3AF",margin:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.email}</p>:null}
                </div>

              <i className="ti ti-chevron-right" style={{color:"#D1D5DB",fontSize:14,flexShrink:0}}/>
            </button>;
          }):null}
        </div>
      </div>

      <div>
        {loadingOrg?<div style={{background:"#F5F3FF",border:"1px solid #DDD6FE",borderRadius:8,padding:"14px 16px",marginBottom:"1rem",display:"flex",alignItems:"center",gap:10}}>

              <p style={{fontSize:11,color:"#16A34A",margin:"0 0 2px"}}>Abertos</p>

          <div style={{background:"#fff",border:"1px solid #E5E7EB",borderRadius:10,overflow:"hidden"}}>

              return <div key={i} style={{borderTop:i===0?"none":"1px solid #F9FAFB"}}>

                </div>:null}
              </div>;
            })}
          </div>
        </div>:null}
      </div>
    </div>:null}

    {novoOpen?<Modal title="Novo Chamado" onClose={function(){setNovoOpen(false);setErr("");}}>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <F label="Cliente *">
          <select style={inp} value={nfCust} onChange={function(e){setNfCust(e.target.value);}}>
            <option value="">Selecionar cliente...</option>
            {customers.map(function(c,ci){return <option key={ci} value={String(c.id)}>{c.name}{c.email?" - "+c.email:""}</option>;})}
          </select>
        </F>
        <F label="Departamento *">
          {depts.length>0?<select style={inp} value={nfD} onChange={function(e){setNfD(e.target.value);}}>
            <option value="">Selecionar...</option>
            {depts.map(function(d,di){return <option key={di} value={String(d.department_id||d.id||"")}>{getStr(d.name||d.department)||String(d.department_id||d.id||"")}</option>;})}
          </select>:<input style={inp} placeholder="ID do departamento" value={nfD} onChange={function(e){setNfD(e.target.value);}}/>}

        <F label="Assunto *"><input style={inp} value={nfS} onChange={function(e){setNfS(e.target.value);}}/></F>
        <F label="Mensagem *"><textarea style={{...inp,minHeight:80}} value={nfM} onChange={function(e){setNfM(e.target.value);}}/></F>
        {err?<p style={{fontSize:12,color:"#C91B1B",margin:0}}>{err}</p>:null}
        <div style={{display:"flex",gap:8}}>
          <button style={{...bG,flex:1}} onClick={function(){setNovoOpen(false);setErr("");}}>Cancelar</button>
          <button style={{...bR,flex:2}} onClick={doNovo} disabled={sending}>{sending?"Enviando...":"Abrir Chamado"}</button>
        </div>
      </div>
    </Modal>:null}
  </div>;
}

function AgendaPage(){
  var tarefas=loadTarefas();
  var hoje=new Date();
  var [mes,setMes]=React.useState(hoje.getMonth());
  var [ano,setAno]=React.useState(hoje.getFullYear());
  var MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  var DIAS=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  var PRIO_COR={"Crítica":"#DC2626","Alta":"#D97706","Média":"#185FA5","Baixa":"#6B7280"};

  // Monta grade do mês
  var primeiroDia=new Date(ano,mes,1).getDay();
  var diasNoMes=new Date(ano,mes+1,0).getDate();
  var celulas=[];
  for(var i=0;i<primeiroDia;i++)celulas.push(null);
  for(var d=1;d<=diasNoMes;d++)celulas.push(d);
  while(celulas.length%7!==0)celulas.push(null);

  // Tarefas com prazo no mês atual
  function tarefasDia(dia){
    if(!dia)return [];
    return tarefas.filter(function(t){
      if(!t.prazo)return false;
      var dt=new Date(t.prazo);
      return dt.getFullYear()===ano&&dt.getMonth()===mes&&dt.getDate()===dia;
    });
  }

  var [selDia,setSelDia]=React.useState(null);
  var tarefasSel=selDia?tarefasDia(selDia):[];

  // Próximas tarefas com prazo
  var proximas=tarefas.filter(function(t){
    if(!t.prazo||t.status==="Finalizado"||t.status==="Cancelado")return false;
    return new Date(t.prazo)>=new Date(hoje.toDateString());
  }).sort(function(a,b){return new Date(a.prazo)-new Date(b.prazo);}).slice(0,8);

  return <div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:8}}>
      <div>
        <p style={{fontWeight:700,fontSize:16,margin:0}}>📅 Agenda de Tarefas</p>
        <p style={{fontSize:12,color:"#9CA3AF",margin:0}}>{tarefas.filter(function(t){return t.prazo;}).length} tarefa(s) com prazo definido</p>
      </div>
      <a href="https://calendar.google.com" target="_blank" style={{display:"flex",alignItems:"center",gap:6,background:"#EA4335",color:"#fff",borderRadius:8,padding:"7px 14px",fontSize:12,fontWeight:600,textDecoration:"none"}}>
        <i className="ti ti-external-link"/>Abrir Google Calendar
      </a>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"1fr 280px",gap:14}}>
      {/* Calendário */}
      <div style={{background:"#fff",borderRadius:12,padding:"1rem",border:"1px solid #E5E7EB"}}>
        {/* Header navegação */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
          <button onClick={function(){if(mes===0){setMes(11);setAno(ano-1);}else setMes(mes-1);}} style={{background:"none",border:"1px solid #E5E7EB",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:16}}>‹</button>
          <span style={{fontWeight:700,fontSize:15}}>{MESES[mes]} {ano}</span>
          <button onClick={function(){if(mes===11){setMes(0);setAno(ano+1);}else setMes(mes+1);}} style={{background:"none",border:"1px solid #E5E7EB",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:16}}>›</button>
        </div>
        {/* Cabeçalho dias */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:4}}>
          {DIAS.map(function(d){return <div key={d} style={{textAlign:"center",fontSize:11,fontWeight:600,color:"#9CA3AF",padding:"4px 0"}}>{d}</div>;})}
        </div>
        {/* Células */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
          {celulas.map(function(dia,idx){
            if(!dia)return <div key={idx}/>;
            var tsDia=tarefasDia(dia);
            var ehHoje=dia===hoje.getDate()&&mes===hoje.getMonth()&&ano===hoje.getFullYear();
            var sel=selDia===dia;
            return <div key={idx} onClick={function(){setSelDia(sel?null:dia);}} style={{minHeight:56,borderRadius:8,padding:"4px",cursor:"pointer",background:sel?"#EFF6FF":ehHoje?"#FEF2F2":"transparent",border:sel?"1.5px solid #185FA5":ehHoje?"1.5px solid #EA4335":"1px solid transparent",transition:"all .1s"}}>
              <div style={{fontSize:12,fontWeight:ehHoje?700:400,color:ehHoje?"#EA4335":sel?"#185FA5":"#374151",marginBottom:2,textAlign:"center"}}>{dia}</div>
              {tsDia.slice(0,3).map(function(t,i){return <div key={i} style={{fontSize:9,background:(PRIO_COR[t.prioridade]||"#6B7280")+"18",color:PRIO_COR[t.prioridade]||"#6B7280",borderRadius:3,padding:"1px 4px",marginBottom:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontWeight:600}}>{t.titulo}</div>;})}
              {tsDia.length>3&&<div style={{fontSize:9,color:"#9CA3AF",textAlign:"center"}}>+{tsDia.length-3}</div>}
            </div>;
          })}
        </div>

        {/* Tarefas do dia selecionado */}
        {selDia&&<div style={{marginTop:14,borderTop:"1px solid #F3F4F6",paddingTop:12}}>
          <p style={{fontSize:12,fontWeight:600,color:"#374151",margin:"0 0 8px"}}>{selDia} de {MESES[mes]} — {tarefasSel.length} tarefa(s)</p>
          {tarefasSel.length===0?<p style={{fontSize:12,color:"#9CA3AF",margin:0}}>Nenhuma tarefa neste dia.</p>
          :tarefasSel.map(function(t){
            var gcalUrl=(function(){
              var dt=new Date(t.prazo);var fim=new Date(dt.getTime()+60*60*1000);
              var fmt=function(d){return d.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";};
              return "https://calendar.google.com/calendar/r/eventedit?text="+encodeURIComponent("["+t.id+"] "+t.titulo)+"&dates="+fmt(dt)+"/"+fmt(fim)+"&details="+encodeURIComponent("Status: "+t.status+"\nPrioridade: "+t.prioridade+(t.descricao?"\n\n"+t.descricao:""));
            })();
            return <div key={t.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",background:"#F9FAFB",borderRadius:8,marginBottom:6,borderLeft:"3px solid "+(PRIO_COR[t.prioridade]||"#6B7280")}}>
              <div style={{flex:1,minWidth:0}}>
                <p style={{fontSize:12,fontWeight:600,margin:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.titulo}</p>
                <p style={{fontSize:11,color:"#9CA3AF",margin:"2px 0 0"}}>{t.responsavel||"—"} · {new Date(t.prazo).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</p>
              </div>
              <a href={gcalUrl} target="_blank" title="Adicionar ao Google Calendar" style={{background:"#EA4335",color:"#fff",borderRadius:6,padding:"4px 8px",fontSize:10,fontWeight:600,textDecoration:"none",flexShrink:0}}>
                <i className="ti ti-calendar-plus"/>
              </a>
            </div>;
          })}
        </div>}
      </div>

      {/* Próximas tarefas */}
      <div style={{background:"#fff",borderRadius:12,padding:"1rem",border:"1px solid #E5E7EB",alignSelf:"start"}}>
        <p style={{fontSize:13,fontWeight:700,color:"#374151",margin:"0 0 12px"}}>⏰ Próximos prazos</p>
        {proximas.length===0?<p style={{fontSize:12,color:"#9CA3AF"}}>Nenhuma tarefa com prazo futuro.</p>
        :proximas.map(function(t){
          var dt=new Date(t.prazo);
          var diffDias=Math.ceil((dt-new Date())/(1000*60*60*24));
          var cor=diffDias<=1?"#DC2626":diffDias<=3?"#D97706":"#16A34A";
          var gcalUrl=(function(){
            var fim=new Date(dt.getTime()+60*60*1000);
            var fmt=function(d){return d.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";};
            return "https://calendar.google.com/calendar/r/eventedit?text="+encodeURIComponent("["+t.id+"] "+t.titulo)+"&dates="+fmt(dt)+"/"+fmt(fim);
          })();
          return <div key={t.id} style={{padding:"8px 0",borderBottom:"1px solid #F9FAFB"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:6}}>
              <div style={{flex:1,minWidth:0}}>
                <p style={{fontSize:12,fontWeight:600,margin:"0 0 2px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.titulo}</p>
                <p style={{fontSize:11,color:"#9CA3AF",margin:0}}>{dt.toLocaleDateString("pt-BR")} {dt.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</p>
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4,flexShrink:0}}>
                <span style={{fontSize:10,fontWeight:700,color:cor,background:cor+"15",borderRadius:10,padding:"1px 7px",whiteSpace:"nowrap"}}>{diffDias<=0?"Hoje":diffDias===1?"Amanhã":diffDias+"d"}</span>
                <a href={gcalUrl} target="_blank" title="Adicionar ao Google Calendar" style={{fontSize:10,color:"#EA4335",textDecoration:"none"}}>
                  <i className="ti ti-calendar-plus" style={{fontSize:13}}/>
                </a>
              </div>
            </div>
          </div>;
        })}
      </div>
    </div>
  </div>;
}

function App(){
  const [users,setUsers]=React.useState(DEFAULT_USERS);
  const [session,setSession]=React.useState(null);
  const [view,setView]=React.useState("dashboard"); // +modulos
  const [tabs,setTabs]=React.useState([{v:"dashboard",label:"Clientes",icon:"ti-users",color:"#C91B1B"}]);
  const [activeTab,setActiveTab]=React.useState("dashboard");

  function openTab(item){
    setTabs(function(prev){
      if(prev.find(function(t){return t.v===item.v;}))return prev;
      return [...prev,{v:item.v,label:item.label,icon:item.icon,color:item.color}];
    });
    setActiveTab(item.v);
    setView(item.v);
  }
  function closeTab(v,e){
    e&&e.stopPropagation();
    setTabs(function(prev){
      var next=prev.filter(function(t){return t.v!==v;});
      if(next.length===0)next=[{v:"dashboard",label:"Clientes",icon:"ti-users",color:"#C91B1B"}];
      return next;
    });
    setTabs(function(prev){
      if(activeTab===v){
        var idx=tabs.findIndex(function(t){return t.v===v;});
        var nextTab=tabs[idx-1]||tabs[idx+1]||tabs[0];
        if(nextTab&&nextTab.v!==v){setActiveTab(nextTab.v);setView(nextTab.v);}
      }
      return prev;
    });
  }
  function switchTab(v){setActiveTab(v);setView(v);}
  const [clients,setClients]=React.useState([]);
  const [sel,setSel]=React.useState(null);
  const [tab,setTab]=React.useState("info");
  const [modal,setModal]=React.useState(null);
  const [loginErr,setLoginErr]=React.useState("");
  const [loginF,setLoginF]=React.useState({user:"",pass:""});
  const [form,setForm]=React.useState({});
  const [contactNote,setContactNote]=React.useState("");
  const [search,setSearch]=React.useState("");
  const [stageF,setStageF]=React.useState(0);
  const [propostaClient,setPropostaClient]=React.useState(null);
  const [sideOpen,setSideOpen]=React.useState(false);

  React.useEffect(()=>{
    db.get("clientes").then(v=>{if(v)setClients(v);}).catch(()=>{});
    db.get("usuarios").then(v=>{
      if(v&&v.length>0){
        // Garante que os usuários padrão sempre existem (merge)
        var merged=[...v];
        DEFAULT_USERS.forEach(function(du){
          if(!merged.find(function(u){return u.user===du.user;})) merged.push(du);
        });
        setUsers(merged);
      }
      // Se não há nada no banco, mantém DEFAULT_USERS já carregado
    }).catch(()=>{});
  },[]);

  async function saveClients(list){setClients(list);await db.set("clientes",list);}

  function login(){
    const allUsers=[...users,...DEFAULT_USERS.filter(du=>!users.find(u=>u.user===du.user))];
    const u=allUsers.find(x=>x.user===loginF.user&&x.pass===loginF.pass);
    u?setSession(u):setLoginErr("Usuário ou senha incorretos.");
  }

  function exportarDados(){
    var dados={};
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.startsWith("st_")){
        try{dados[k]=JSON.parse(localStorage.getItem(k));}catch(e){dados[k]=localStorage.getItem(k);}
      }
    }
    var json=JSON.stringify(dados,null,2);
    var blob=new Blob([json],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;a.download="softtur-backup-"+new Date().toISOString().slice(0,10)+".json";
    a.click();URL.revokeObjectURL(url);
  }
  function importarDados(){
    var input=document.createElement("input");
    input.type="file";input.accept=".json";
    input.onchange=function(e){
      var file=e.target.files[0];
      if(!file)return;
      var reader=new FileReader();
      reader.onload=function(ev){
        try{
          var dados=JSON.parse(ev.target.result);
          var promises=[];
          Object.keys(dados).forEach(function(k){
            if(k.startsWith("st_")){
              localStorage.setItem(k,JSON.stringify(dados[k]));
              // Sincroniza com Supabase
              var dbKey=k.replace("st_","");
              promises.push(db.set(dbKey,dados[k]));
            }
          });
          Promise.all(promises).then(function(){
            alert("✅ Dados sincronizados com o banco! A página será recarregada.");
            window.location.reload();
          }).catch(function(){
            alert("✅ Dados importados localmente. Recarregando...");
            window.location.reload();
          });
        }catch(err){alert("❌ Erro ao importar: "+err.message);}
      };
      reader.readAsText(file);
    };
    input.click();
  }
  function sincronizarAgora(){
    var keys=[];
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.startsWith("st_"))keys.push(k);
    }
    var promises=keys.map(function(k){
      try{
        var v=JSON.parse(localStorage.getItem(k));
        return db.set(k.replace("st_",""),v);
      }catch(e){return Promise.resolve();}
    });
    Promise.all(promises).then(function(){
      alert("✅ "+keys.length+" itens sincronizados! Clientes, tarefas e configurações agora visíveis para todos.");
    });
  }
  function addClient(){
    const c={id:Date.now(),...form,stageId:1,criadoEm:today(),historico:[{data:today(),hora:now(),usuario:session.nome,tipo:"cadastro",texto:"Cliente cadastrado."}],implantacao:[]};
    saveClients([...clients,c]);setModal(null);setForm({});
  }
  function editClient(){
    const list=clients.map(c=>c.id===sel.id?{...c,...form}:c);
    saveClients(list);setSel(list.find(c=>c.id===sel.id));setModal(null);setForm({});
  }
  function updateClient(id,data){
    const list=clients.map(c=>c.id===id?{...c,...data}:c);
    saveClients(list);setSel(list.find(c=>c.id===id));
  }
  function changeStage(id,stageId){
    const st=STAGES.find(x=>x.id===stageId);
    const list=clients.map(c=>c.id!==id?c:{...c,stageId,historico:[{data:today(),hora:now(),usuario:session.nome,tipo:"estagio",texto:"Estágio: "+st.label},...(c.historico||[])]});
    saveClients(list);setSel(list.find(c=>c.id===id));
  }
  function addContact(){
    if(!contactNote.trim())return;
    const list=clients.map(c=>c.id!==sel.id?c:{...c,historico:[{data:today(),hora:now(),usuario:session.nome,tipo:"contato",texto:contactNote},...(c.historico||[])]});
    saveClients(list);setSel(list.find(c=>c.id===sel.id));setContactNote("");setModal(null);
  }
  function delClient(id){if(!confirm("Remover cliente?"))return;saveClients(clients.filter(c=>c.id!==id));setSel(null);setView("dashboard");}

  const filtered=clients.filter(c=>(!search||[c.nome,c.empresa].join(" ").toLowerCase().includes(search.toLowerCase()))&&(!stageF||c.stageId===stageF));

  // ─ LOGIN ─
  if(!session)return <div style={{padding:"2rem 0",display:"flex",justifyContent:"center"}}>
    <div style={{...card,padding:"2rem",width:"100%",maxWidth:360}}>
      <div style={{textAlign:"center",marginBottom:"1.5rem"}}>
        <img src={LOGO_B64} alt="Soft Tur" style={{width:80,height:"auto",marginBottom:12}}/>
        <p style={{fontWeight:600,fontSize:14,margin:"0 0 2px"}}>Acompanhamento de Implantação</p>
        <p style={{fontSize:12,color:"#9CA3AF",margin:0}}>Acesso restrito à equipe</p>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <input style={inp} placeholder="Usuário" value={loginF.user} onChange={e=>setLoginF(p=>({...p,user:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&login()}/>
        <input style={inp} type="password" placeholder="Senha" value={loginF.pass} onChange={e=>setLoginF(p=>({...p,pass:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&login()}/>
        {loginErr&&<p style={{fontSize:12,color:"#C91B1B",margin:0}}>{loginErr}</p>}
        <button style={{...bR,padding:"10px 0",width:"100%"}} onClick={login}>Entrar</button>
      </div>
      
    </div>
  </div>;

  var NAV_ITEMS=[
    {icon:"ti-calendar-event",label:"Google Agenda",v:"agenda",color:"#EA4335"},
    {icon:"ti-users",label:"Clientes",v:"dashboard",color:"#C91B1B"},
    {icon:"ti-clipboard-list",label:"Tarefas",v:"tarefas",color:"#7C3AED"},

        return <div key={c.id} style={{display:"flex",alignItems:"center",gap:14,padding:"12px 16px",borderTop:i===0?"none":"1px solid #F9FAFB",cursor:"pointer"}} onClick={()=>{setSel(c);setTab("info");openTab({v:"detail",label:c.empresa||"Cliente",icon:"ti-user",color:"#C91B1B"});setView("detail");}}>
        <div style={{width:38,height:38,borderRadius:"50%",background:"#FEF2F2",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <span style={{fontSize:14,fontWeight:600,color:"#C91B1B"}}>{(c.empresa||"?")[0].toUpperCase()}</span>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <p style={{fontSize:14,fontWeight:500,color:"#374151",margin:0,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{c.empresa}</p>
          <p style={{fontSize:12,color:"#9CA3AF",margin:"1px 0 0"}}>{c.categoria&&<span style={{color:"#C91B1B",fontWeight:600}}>{c.categoria} · </span>}{c.nome}</p>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
          {_pr&&<span style={{fontSize:10,fontWeight:700,background:_pr.status==="aprovado"?"#DCFCE7":"#FEE2E2",color:_pr.status==="aprovado"?"#16A34A":"#DC2626",border:"1px solid "+(_pr.status==="aprovado"?"#16A34A":"#DC2626"),borderRadius:10,padding:"2px 7px"}}>
            {_pr.status==="aprovado"?"✅ Aprovada":"❌ Recusada"}
          </span>}
          <StageBadge id={c.stageId} sm/>
          <i className="ti ti-chevron-right" style={{fontSize:16,color:"#D1D5DB"}}/>
        </div>
      </div>;}
      )}
    </div>
    {modal==="add"&&<Modal title="Novo cliente" wide onClose={()=>setModal(null)}><ClientForm form={form} setForm={setForm} canSeeValues={session.verValores}/><div style={{display:"flex",gap:8,marginTop:"1rem"}}><button style={{...bG,flex:1}} onClick={()=>setModal(null)}>Cancelar</button><button style={{...bR,flex:2}} onClick={addClient}>Cadastrar cliente</button></div></Modal>}
    </div>{/* end conteúdo principal */}
  </div>;
}

(function(){
  var params=new URLSearchParams(window.location.search);
  var b64=params.get("proposta");
  var root=document.getElementById("root");
  if(b64){
    var s=document.createElement("style");
    s.textContent="@media print{.no-print{display:none!important}body{background:#fff!important}}";
    document.head.appendChild(s);
    ReactDOM.createRoot(root).render(React.createElement(PropostaPublica,null));
  }else{
    ReactDOM.createRoot(root).render(React.createElement(App,null));
  }
})();

</script>
</body>
</html>
