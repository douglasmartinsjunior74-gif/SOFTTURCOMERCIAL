function fmt(v){ return (parseFloat(String(v||0).replace(",","."))||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function today(){ return new Date().toLocaleDateString("pt-BR"); }
function now(){ return new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }
function modTotal(mods){ return (mods||[]).reduce((a,m)=>a+(parseFloat(String(m&&m.valor||0).replace(",","."))||0),0); }
function modSetup(mods){ return (mods||[]).reduce((a,m)=>a+(parseFloat(String(m&&m.startup||0).replace(",","."))||0),0); }

// ── Database: localStorage ──────────────────────────────
const db = {
  get: async function(k) {
    try {
      const r = await fetch("/.netlify/functions/db-proxy?key=" + encodeURIComponent(k));
      const d = await r.json();
      if (d && d.value !== undefined && d.value !== null) {
        // Atualiza cache local
        try { localStorage.setItem("st_" + k, JSON.stringify(d.value)); } catch(e) {}
        return d.value;
      }
    } catch(e) {}
    // Fallback: localStorage
    try { var v = localStorage.getItem("st_" + k); return v ? JSON.parse(v) : null; } catch(e) { return null; }
  },
  set: async function(k, v) {
    // Salva no localStorage imediatamente (responsivo)
    try { localStorage.setItem("st_" + k, JSON.stringify(v)); } catch(e) {}
    // Sincroniza com Supabase em background
    fetch("/.netlify/functions/db-proxy", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: k, value: v }),
    }).catch(function() {});
    return v;
  }
};

// ── ImplantacaoTab ────────────────────────────
function ImplantacaoTab({client,session,onUpdate}){
  const TIPOS=[
    {id:"treinamento",label:"Treinamento",  color:"#0F6E56",bg:"#E1F5EE",icon:"ti-school"},
    {id:"configuracao",label:"Configuração",color:"#BA7517",bg:"#FAEEDA",icon:"ti-settings"},
    {id:"pendencia",  label:"Pendência",    color:"#A32D2D",bg:"#FCEBEB",icon:"ti-alert-circle"},
    {id:"conclusao",  label:"Conclusão",    color:"#0C447C",bg:"#E6F1FB",icon:"ti-circle-check"},
    {id:"reuniao",    label:"Reunião",      color:"#534AB7",bg:"#EEEDFE",icon:"ti-users"},
  ];
  const [nota,setNota]=React.useState("");
  const [tipo,setTipo]=React.useState("treinamento");
  const [and,setAnd]=React.useState(client.andamento||"");
  const [saved,setSaved]=React.useState(false);
  function addNota(){
    if(!nota.trim())return;
    const entry={id:Date.now(),data:today(),hora:now(),usuario:session.nome,setor:session.setor||"",tipo,texto:nota};
    onUpdate({implantacao:[entry,...(client.implantacao||[])]});
    setNota("");
  }
  function saveAnd(){setSaved(true);onUpdate({andamento:and});setTimeout(()=>setSaved(false),1200);}
  return <div style={{display:"flex",flexDirection:"column",gap:"1rem"}}>
    <div style={{...card,padding:"1rem 1.25rem"}}>
      <p style={{fontSize:13,fontWeight:500,margin:"0 0 8px"}}>📋 Andamento geral</p>
      <textarea value={and} onChange={e=>setAnd(e.target.value)} placeholder="Descreva o andamento atual, próximos passos, pendências..." style={{...inp,minHeight:80,resize:"vertical",lineHeight:1.6,marginBottom:8}}/>
      <button style={{...bR,padding:"7px 16px",fontSize:13}} onClick={saveAnd}>{saved?"✓ Salvo!":"Salvar andamento"}</button>
    </div>
    <div style={{...card,padding:"1rem 1.25rem"}}>
      <p style={{fontSize:13,fontWeight:500,margin:"0 0 10px"}}>➕ Registrar atualização</p>
      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
        {TIPOS.map(t=><button key={t.id} type="button" onClick={()=>setTipo(t.id)} style={{border:tipo===t.id?"1.5px solid "+t.color:"1.5px solid #E5E7EB",borderRadius:20,padding:"4px 12px",fontSize:12,fontWeight:tipo===t.id?600:400,background:tipo===t.id?t.bg:"#F9FAFB",color:tipo===t.id?t.color:"#9CA3AF",cursor:"pointer"}}><i className={"ti "+t.icon}/> {t.label}</button>)}
      </div>
      <textarea value={nota} onChange={e=>setNota(e.target.value)} placeholder="Descreva o registro..." style={{...inp,minHeight:70,resize:"vertical",lineHeight:1.6,marginBottom:8}}/>
      <button style={{...bR,padding:"7px 16px",fontSize:13}} onClick={addNota}>Registrar</button>
    </div>
    <div style={{...card,padding:"1rem 1.25rem"}}>
      <p style={{fontSize:13,fontWeight:500,margin:"0 0 12px"}}>🕐 Histórico</p>
      {(client.implantacao||[]).length===0
        ?<p style={{fontSize:13,color:"#9CA3AF",textAlign:"center",padding:"1.5rem 0"}}>Nenhum registro ainda.</p>
        :(client.implantacao||[]).map((h,i)=>{const t=TIPOS.find(x=>x.id===h.tipo)||TIPOS[0];return <div key={h.id||i} style={{display:"flex",gap:12,padding:"10px 0",borderBottom:"1px solid #F3F4F6"}}>
          <div style={{width:32,height:32,borderRadius:"50%",background:t.bg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            <i className={"ti "+t.icon} style={{fontSize:14,color:t.color}}/>
          </div>
          <div style={{flex:1}}>
            <div style={{display:"flex",gap:6,marginBottom:3}}>
              <span style={{fontSize:11,fontWeight:600,color:t.color,background:t.bg,padding:"1px 8px",borderRadius:10}}>{t.label}</span>
              {h.setor&&<span style={{fontSize:11,color:"#9CA3AF"}}>{h.setor}</span>}
            </div>
            <p style={{fontSize:13,color:"#374151",margin:"0 0 2px",lineHeight:1.5}}>{h.texto}</p>
            <p style={{fontSize:11,color:"#9CA3AF",margin:0}}>{h.data} às {h.hora} · {h.usuario}</p>
          </div>
        </div>;})}
    </div>
  </div>;
}

// ── UsersPage ─────────────────────────────────
function UsersPage({session,users,setUsers,onBack}){
  const [modal,setModal]=React.useState(null);
  const [form,setForm]=React.useState({});
  const [err,setErr]=React.useState("");
  const sv=k=>e=>setForm(p=>({...p,[k]:e.target.type==="checkbox"?e.target.checked:e.target.value}));
  async function save(){
    if(!form.user||!form.pass||!form.nome){setErr("Preencha usuário, senha e nome.");return;}
    let list;
    if(modal==="add"){
      if(users.find(u=>u.user===form.user)){setErr("Usuário já existe.");return;}
      list=[...users,{...form,id:Date.now(),isAdmin:!!form.isAdmin,verValores:!!form.verValores}];
    }else{
      list=users.map(u=>u.id===form.id?{...u,...form}:u);
    }
    await db.set("usuarios",list);setUsers(list);setModal(null);setForm({});setErr("");
  }
  async function del(id){
    if(id===session.id){alert("Não é possível excluir o próprio usuário.");return;}
    if(!confirm("Remover usuário?"))return;
    const list=users.filter(u=>u.id!==id);
    await db.set("usuarios",list);setUsers(list);
  }
  return <div style={{padding:"1rem 0"}}>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:"1.5rem"}}>
      <button style={bG} onClick={onBack}><i className="ti ti-arrow-left"/> Voltar</button>
      <p style={{fontWeight:600,fontSize:15,margin:0,flex:1}}>Gerenciar usuários</p>
      <button style={bR} onClick={()=>{setForm({verValores:false,isAdmin:false});setModal("add");}}>+ Novo usuário</button>
    </div>
    <div style={card}>
      {users.map((u,i)=><div key={u.id} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",borderTop:i===0?"none":"1px solid #F3F4F6"}}>
        <div style={{width:36,height:36,borderRadius:"50%",background:u.isAdmin?"#FEF2F2":"#EFF6FF",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <span style={{fontSize:13,fontWeight:600,color:u.isAdmin?"#C91B1B":"#185FA5"}}>{u.nome[0]}</span>
        </div>
        <div style={{flex:1}}>
          <p style={{fontSize:14,fontWeight:500,margin:0}}>{u.nome} <span style={{fontSize:12,color:"#9CA3AF"}}>@{u.user}</span></p>
          <div style={{display:"flex",gap:5,marginTop:3,flexWrap:"wrap"}}>
            <span style={{fontSize:11,padding:"1px 8px",borderRadius:10,background:u.isAdmin?"#FEF2F2":"#F3F4F6",color:u.isAdmin?"#C91B1B":"#6B7280"}}>{u.isAdmin?"Admin":"Usuário"}</span>
            {u.setor&&<span style={{fontSize:11,padding:"1px 8px",borderRadius:10,background:"#EFF6FF",color:"#185FA5"}}>{u.setor}</span>}
            <span style={{fontSize:11,padding:"1px 8px",borderRadius:10,background:u.verValores?"#ECFDF5":"#F3F4F6",color:u.verValores?"#059669":"#9CA3AF"}}>{u.verValores?"👁 Vê valores":"🔒 Sem valores"}</span>
          </div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button style={{...bG,padding:"5px 10px"}} onClick={()=>{setForm({...u});setModal("edit");}}><i className="ti ti-edit"/></button>
          <button style={{...bG,padding:"5px 10px",color:"#C91B1B"}} onClick={()=>del(u.id)}><i className="ti ti-trash"/></button>
        </div>
      </div>)}
    </div>
    {modal&&<Modal title={modal==="add"?"Novo usuário":"Editar usuário"} onClose={()=>{setModal(null);setForm({});setErr("");}}>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <F label="Nome" req><input style={inp} value={form.nome||""} onChange={sv("nome")} placeholder="Nome completo"/></F>
          <F label="Setor"><input style={inp} value={form.setor||""} onChange={sv("setor")} placeholder="Ex: Suporte"/></F>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <F label="Usuário" req><input style={inp} value={form.user||""} onChange={sv("user")} placeholder="login"/></F>
          <F label="Senha" req><input style={inp} type="password" value={form.pass||""} onChange={sv("pass")} placeholder="senha"/></F>
        </div>
        <div style={{background:"#F9FAFB",borderRadius:8,padding:"12px 14px",display:"flex",flexDirection:"column",gap:10}}>
          <label style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer"}}>
            <input type="checkbox" checked={!!form.verValores} onChange={sv("verValores")} style={{accentColor:"#C91B1B",width:16,height:16,marginTop:2}}/>
            <div><p style={{fontSize:13,fontWeight:500,margin:0}}>Ver valores da proposta</p><p style={{fontSize:11,color:"#9CA3AF",margin:0}}>Acesso ao relatório com valores financeiros</p></div>
          </label>
          <label style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer"}}>
            <input type="checkbox" checked={!!form.isAdmin} onChange={sv("isAdmin")} style={{accentColor:"#C91B1B",width:16,height:16,marginTop:2}}/>
            <div><p style={{fontSize:13,fontWeight:500,margin:0}}>Administrador</p><p style={{fontSize:11,color:"#9CA3AF",margin:0}}>Acesso total ao sistema</p></div>
          </label>
        </div>
        {err&&<p style={{fontSize:12,color:"#C91B1B",margin:0}}>{err}</p>}
        <div style={{display:"flex",gap:8}}>
          <button style={{...bG,flex:1}} onClick={()=>{setModal(null);setForm({});setErr("");}}>Cancelar</button>
          <button style={{...bR,flex:2}} onClick={save}>{modal==="add"?"Criar":"Salvar"}</button>
        </div>
      </div>
    </Modal>}
  </div>;
}

        var vM=parseFloat(String(m&&m.valor||0).replace(",","."))||0;
        var vS=parseFloat(String(m&&m.startup||0).replace(",","."))||0;
        return "<tr>"
          +"<td style='padding:7px 12px;font-size:12px;color:#374151;border-bottom:1px solid #f5f5f5'>"+(m.nome||m)+"</td>"
          +"<td style='padding:7px 12px;font-size:12px;text-align:right;color:"+(showVal?"#C91B1B":"#ddd")+";font-weight:600;border-bottom:1px solid #f5f5f5'>"+(showVal?fmt(vM):"-")+"</td>"

          +"<td style='padding:10px 12px;font-size:13px;font-weight:800;color:#C91B1B'>Total da proposta</td>"

        +(showVal?"<p style='font-size:11px;color:#FCA5A5;margin:0'>M: "+fmt(tc)+" S: "+fmt(tcS)+"</p>":"")
        +"</div>"
        +"<table style='width:100%;border-collapse:collapse'>"
        +headerRow+modRows+totalRow
        +"</table></div>";
    }).join("");
    w.document.write("<!DOCTYPE html><html><head><meta charset='UTF-8'/><title>Relatorio Soft Tur</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;padding:30px;color:#111}@media print{.np{display:none!important}}</style></head><body><div class='np' style='margin-bottom:20px;display:flex;gap:10px'><button onclick='window.print()' style='background:#C91B1B;color:#fff;border:none;padding:8px 20px;border-radius:7px;cursor:pointer;font-size:14px'>Imprimir PDF</button><button onclick='window.close()' style='background:#f3f4f6;border:1px solid #ddd;padding:8px 16px;border-radius:7px;cursor:pointer;font-size:14px'>Fechar</button></div><div style='display:flex;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid #C91B1B'><div><p style='font-size:20px;font-weight:700;margin:0'>Relatorio de Propostas</p><p style='font-size:12px;color:#6b7280;margin:4px 0 0'>"+new Date().toLocaleString("pt-BR")+" - "+lista.length+" cliente(s) - "+session.nome+"</p></div></div>"+rows+totalGeralHtml+"\n</body></html>");
    w.document.close();
  }

function TaskModal({project,onClose,session}){
  const KEY="notas_"+project.gid;
  const [tasks,setTasks]=React.useState([]);
  const [loading,setLoading]=React.useState(true);
  const [tab,setTab]=React.useState("pendentes");
  const [notas,setNotas]=React.useState({});
  const [editing,setEditing]=React.useState(null);
  const [nota,setNota]=React.useState("");
  React.useEffect(()=>{
    db.get(KEY).then(v=>setNotas(v||{})).catch(()=>{});
    fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,system:"Retorne APENAS JSON válido sem markdown.",mcp_servers:[{type:"url",url:"https://mcp.asana.com/v2/mcp",name:"asana-mcp"}],messages:[{role:"user",content:"Liste tarefas do projeto Asana GID "+project.gid+". Retorne APENAS [{gid,name,completed}]. Máximo 100 itens."}]})})
    .then(r=>r.json()).then(d=>{
      const txt=(d.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("");
      try{const arr=JSON.parse(txt.replace(/```json|```/g,"").trim());if(Array.isArray(arr))setTasks(arr);}catch(e){}
    }).catch(()=>{}).finally(()=>setLoading(false));
  },[]);
  async function saveNota(gid){
    const n={...notas,[gid]:{texto:nota,autor:session.nome,data:today(),hora:now()}};
    setNotas(n);await db.set(KEY,n);setEditing(null);setNota("");
  }
  async function delNota(gid){
    const n={...notas};delete n[gid];
    setNotas(n);await db.set(KEY,n);
  }
  const pend=tasks.filter(t=>!t.completed);
  const done=tasks.filter(t=>t.completed);
  const pct=tasks.length?Math.round(done.length/tasks.length*100):0;
  const list=tab==="pendentes"?pend:done;
  return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",display:"flex",alignItems:"flex-end",justifyContent:"flex-end",zIndex:200}}>
    <div style={{background:"#fff",width:"100%",maxWidth:520,height:"100vh",display:"flex",flexDirection:"column",boxShadow:"-8px 0 32px rgba(0,0,0,.25)"}}>
      <div style={{background:"#111",padding:"14px 18px",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:10}}>
          <div style={{flex:1}}>
            <p style={{fontSize:15,fontWeight:600,color:"#fff",margin:0}}>{project.name}</p>
            <div style={{display:"flex",alignItems:"center",gap:8,marginTop:6}}>
              <div style={{flex:1,background:"#333",borderRadius:4,height:6,overflow:"hidden"}}>
                <div style={{height:6,background:pct>70?"#3B6D11":pct>30?"#BA7517":"#185FA5",width:pct+"%",transition:"width .5s ease",borderRadius:4}}/>
              </div>
              <span style={{fontSize:12,color:"#aaa",whiteSpace:"nowrap"}}>{done.length}/{tasks.length} — {pct}%</span>
            </div>
          </div>
          <div style={{display:"flex",gap:6,flexShrink:0}}>
            <a href={"https://app.asana.com/0/"+project.gid} target="_blank" rel="noopener noreferrer" style={{background:"#F06A6A",color:"#fff",border:"none",borderRadius:6,padding:"5px 10px",fontSize:12,cursor:"pointer",textDecoration:"none"}}>Asana</a>
            <button onClick={onClose} style={{background:"#333",color:"#fff",border:"none",borderRadius:6,padding:"5px 10px",cursor:"pointer"}}><i className="ti ti-x"/></button>
          </div>
        </div>
      </div>
      <div style={{display:"flex",borderBottom:"1px solid #F3F4F6",flexShrink:0}}>
        {[{id:"pendentes",label:"Pendentes ("+pend.length+")",c:"#C91B1B"},{id:"concluidas",label:"Concluídas ("+done.length+")",c:"#3B6D11"}].map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,border:"none",background:"none",padding:"11px 0",fontSize:13,fontWeight:tab===t.id?600:400,color:tab===t.id?t.c:"#9CA3AF",borderBottom:tab===t.id?"2px solid "+t.c:"2px solid transparent",cursor:"pointer"}}>{t.label}</button>)}
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"12px 16px"}}>
        {loading?<div style={{textAlign:"center",padding:"3rem 0",color:"#9CA3AF"}}>Carregando tarefas...</div>
        :list.length===0?<div style={{textAlign:"center",padding:"3rem 0",color:"#9CA3AF"}}>{tab==="pendentes"?"Nenhuma pendência!":"Nenhuma tarefa concluída."}</div>
        :list.map((t,i)=>{
          const nt=notas[t.gid];
          return <div key={t.gid||i} style={{marginBottom:8,border:"1px solid "+(tab==="pendentes"?"#FECACA":"#BBF7D0"),borderRadius:8,overflow:"hidden"}}>
            <div style={{padding:"10px 12px",background:tab==="pendentes"?"#fff":"#F0FDF4"}}>
              <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
                <div style={{width:20,height:20,borderRadius:"50%",background:tab==="concluidas"?"#DCFCE7":"#FEF2F2",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1}}>
                  <i className={"ti "+(tab==="concluidas"?"ti-check":"ti-clock")} style={{fontSize:11,color:tab==="concluidas"?"#16A34A":"#C91B1B"}}/>
                </div>
                <p style={{fontSize:13,color:"#374151",margin:0,flex:1,lineHeight:1.5}}>{t.name}</p>
              </div>
              {nt&&editing!==t.gid&&<div style={{marginTop:8,background:"#FEFCE8",border:"1px solid #FEF08A",borderRadius:6,padding:"8px 10px"}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                  <span style={{fontSize:10,fontWeight:600,color:"#A16207"}}>Obs. interna · {nt.autor} · {nt.data}</span>
                  <div style={{display:"flex",gap:4}}>
                    <button onClick={()=>{setEditing(t.gid);setNota(nt.texto);}} style={{border:"none",background:"none",cursor:"pointer",color:"#A16207",fontSize:11}}><i className="ti ti-edit"/></button>
                    <button onClick={()=>delNota(t.gid)} style={{border:"none",background:"none",cursor:"pointer",color:"#C91B1B",fontSize:11}}><i className="ti ti-trash"/></button>
                  </div>
                </div>
                <p style={{fontSize:12,color:"#713F12",margin:0,lineHeight:1.5}}>{nt.texto}</p>
              </div>}
              {editing===t.gid?<div style={{marginTop:8}}>
                <textarea value={nota} onChange={e=>setNota(e.target.value)} placeholder="Observação interna..." style={{...inp,minHeight:70,resize:"vertical",lineHeight:1.5,fontSize:13,marginBottom:6}}/>
                <div style={{display:"flex",gap:6}}>
                  <button onClick={()=>{setEditing(null);setNota("");}} style={{...bG,flex:1,padding:"6px 0",fontSize:12}}>Cancelar</button>
                  <button onClick={()=>saveNota(t.gid)} style={{...bR,flex:2,padding:"6px 0",fontSize:12}}>Salvar</button>
                </div>
              </div>:!nt&&<button onClick={()=>{setEditing(t.gid);setNota("");}} style={{marginTop:6,border:"none",background:"none",cursor:"pointer",color:"#9CA3AF",fontSize:11,padding:"2px 0",display:"flex",alignItems:"center",gap:4}}>+ Adicionar observação</button>}
            </div>
          </div>;
        })}
      </div>
      <div style={{borderTop:"1px solid #F3F4F6",padding:"10px 16px",flexShrink:0,background:"#FAFAFA",textAlign:"center"}}>
        <p style={{fontSize:11,color:"#9CA3AF",margin:0}}>🔒 Observações visíveis apenas para a equipe</p>
      </div>
    </div>
  </div>;
}

// ── AsanaPage ─────────────────────────────────
function AsanaPage({session,onBack}){
  const [projects,setProjects]=React.useState(ASANA_PROJECTS);
  const [modal,setModal]=React.useState(null);
  const [loading,setLoading]=React.useState(false);
  const [lastSync,setLastSync]=React.useState(null);
  const [search,setSearch]=React.useState("");
  const [sort,setSort]=React.useState("pct");
  const chartRef=React.useRef(null);
  const chartInst=React.useRef(null);
  React.useEffect(()=>{
    db.get("asana_projects").then(v=>{if(v)setProjects(v);}).catch(()=>{});
    db.get("asana_sync").then(v=>{if(v)setLastSync(v);}).catch(()=>{});
  },[]);
  const filtered=projects.filter(p=>p.total>2&&!search||p.name.toLowerCase().includes(search.toLowerCase())).sort((a,b)=>sort==="pct"?(b.concluidas/Math.max(b.total,1))-(a.concluidas/Math.max(a.total,1)):sort==="pending"?b.pendentes-a.pendentes:a.name.localeCompare(b.name));
  const tT=filtered.reduce((a,p)=>a+p.total,0);
  const tC=filtered.reduce((a,p)=>a+p.concluidas,0);
  const pct=tT?Math.round(tC/tT*100):0;
  function getC(p){if(p>=80)return{c:"#3B6D11",bg:"#EAF3DE"};if(p>=40)return{c:"#BA7517",bg:"#FAEEDA"};if(p>0)return{c:"#185FA5",bg:"#E6F1FB"};return{c:"#9CA3AF",bg:"#F3F4F6"};}
  React.useEffect(()=>{
    if(!chartRef.current||typeof Chart==="undefined")return;
    if(chartInst.current)chartInst.current.destroy();
    const top=filtered.slice(0,15);
    chartInst.current=new Chart(chartRef.current,{type:"bar",data:{labels:top.map(p=>p.name.length>14?p.name.substring(0,14)+"...":p.name),datasets:[{label:"Concluídas",data:top.map(p=>p.concluidas),backgroundColor:"#3B6D11",borderRadius:4,stack:"s"},{label:"Pendentes",data:top.map(p=>p.pendentes),backgroundColor:"#E5E7EB",borderRadius:4,stack:"s"}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"top"}},scales:{x:{stacked:true,grid:{display:false},ticks:{font:{size:10}}},y:{stacked:true,beginAtZero:true}}}});
    return()=>{if(chartInst.current)chartInst.current.destroy();};
  },[filtered.map(p=>p.concluidas).join()]);
  async function sync(){
    setLoading(true);
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:"Retorne APENAS JSON válido sem markdown.",mcp_servers:[{type:"url",url:"https://mcp.asana.com/v2/mcp",name:"asana-mcp"}],messages:[{role:"user",content:"Liste projetos Asana workspace 1200539544080164 com gid,name,num_tasks,num_completed_tasks,num_incomplete_tasks. Retorne APENAS [{gid,name,total,concluidas,pendentes}]. Exclua Produtos,Financeiro,Planner."}]})});
      const d=await r.json();
      const txt=(d.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("");
      const arr=JSON.parse(txt.replace(/```json|```/g,"").trim());
      if(Array.isArray(arr)&&arr.length>0){const ts=new Date().toLocaleString("pt-BR");setProjects(arr);setLastSync(ts);await db.set("asana_projects",arr);await db.set("asana_sync",ts);}
    }catch(e){}
    setLoading(false);
  }
  return <div style={{padding:"1rem 0"}}>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:"1.25rem",flexWrap:"wrap"}}>
      <button style={bG} onClick={onBack}><i className="ti ti-arrow-left"/> Voltar</button>
      <div style={{flex:1}}><p style={{fontWeight:600,fontSize:15,margin:0}}>Projetos Asana</p><p style={{fontSize:11,color:"#9CA3AF",margin:0}}>{lastSync?"Sync: "+lastSync:"Dados locais"}</p></div>
      <button style={{...bR,background:loading?"#999":"#F06A6A"}} onClick={sync} disabled={loading}><i className={"ti "+(loading?"ti-loader":"ti-refresh")} style={{marginRight:6}}/>{loading?"Sincronizando...":"Sincronizar"}</button>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:"1.25rem"}}>
      {[{l:"Projetos",v:filtered.length,c:"#185FA5",bg:"#EFF6FF"},{l:"Tarefas",v:tT,c:"#534AB7",bg:"#EEEDFE"},{l:"Concluídas",v:tC,c:"#3B6D11",bg:"#EAF3DE"},{l:"Progresso",v:pct+"%",c:pct>50?"#3B6D11":"#BA7517",bg:pct>50?"#EAF3DE":"#FAEEDA"}].map(x=><div key={x.l} style={{background:x.bg,border:"1px solid "+x.c+"22",borderRadius:8,padding:"12px 14px"}}><p style={{fontSize:11,color:x.c,margin:"0 0 4px",fontWeight:500}}>{x.l}</p><p style={{fontSize:22,fontWeight:700,color:x.c,margin:0}}>{x.v}</p></div>)}
    </div>
    <div style={{...card,padding:"1.25rem",marginBottom:"1.25rem"}}>
      <p style={{fontSize:13,fontWeight:500,margin:"0 0 1rem"}}>📊 Progresso por projeto (top 15)</p>
      <div style={{height:240,position:"relative"}}><canvas ref={chartRef}/></div>
    </div>
    <div style={{display:"flex",gap:8,marginBottom:"1rem"}}>
      <input style={{...inp,flex:1}} placeholder="Buscar projeto..." value={search} onChange={e=>setSearch(e.target.value)}/>
      <select style={{...inp,width:"auto"}} value={sort} onChange={e=>setSort(e.target.value)}>
        <option value="pct">Mais avançados</option>
        <option value="pending">Mais pendentes</option>
        <option value="name">Nome A-Z</option>
      </select>
    </div>
    <div style={card}>
      {filtered.map((p,i)=>{
        const pc=p.total?Math.round(p.concluidas/p.total*100):0;
        const cl=getC(pc);
        return <div key={p.gid} style={{padding:"12px 16px",borderTop:i===0?"none":"1px solid #F3F4F6",cursor:"pointer"}} onClick={()=>setModal(p)}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6,gap:10,flexWrap:"wrap"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:14,fontWeight:500,color:"#374151"}}>{p.name}</span>
              <span style={{fontSize:11,fontWeight:700,color:cl.c,background:cl.bg,padding:"2px 8px",borderRadius:10}}>{pc}%</span>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <span style={{fontSize:12,color:"#9CA3AF"}}><span style={{color:"#3B6D11",fontWeight:600}}>{p.concluidas}</span>/{p.total}</span>
              <a href={"https://app.asana.com/0/"+p.gid} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()} style={{fontSize:11,color:"#F06A6A",textDecoration:"none",fontWeight:500}}>Abrir ↗</a>
            </div>
          </div>
          <div style={{background:"#F3F4F6",borderRadius:4,height:7,overflow:"hidden"}}>
            <div style={{height:7,background:cl.c,width:pc+"%",borderRadius:4,transition:"width .5s"}}/>
          </div>
        </div>;
      })}
    </div>
    {modal&&<TaskModal project={modal} onClose={()=>setModal(null)} session={session}/>}
  </div>;
}

// ── GraficoDashboard ──────────────────────────
function GraficoDashboard({clients}){
  const chartRef=React.useRef(null);
  const chartInst=React.useRef(null);
  const dados=[
    {label:"Proposta enviada",stageId:2,color:"#185FA5",bg:"rgba(24,95,165,.15)"},
    {label:"Contrato assinado",stageId:3,color:"#534AB7",bg:"rgba(83,74,183,.15)"},
    {label:"Em implantação",stageId:4,color:"#BA7517",bg:"rgba(186,117,23,.15)"},
    {label:"Concluídas",stageId:8,color:"#3B6D11",bg:"rgba(59,109,17,.15)"},
  ].map(d=>({...d,total:clients.filter(c=>c.stageId===d.stageId).length}));
  const total=clients.length||1;
  React.useEffect(()=>{
    if(!chartRef.current||typeof Chart==="undefined")return;
    if(chartInst.current)chartInst.current.destroy();
    chartInst.current=new Chart(chartRef.current,{type:"bar",data:{labels:dados.map(d=>d.label),datasets:[{label:"Clientes",data:dados.map(d=>d.total),backgroundColor:dados.map(d=>d.color),borderRadius:8,borderSkipped:false,barThickness:40}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1,precision:0},grid:{color:"rgba(0,0,0,.06)"}},x:{grid:{display:false}}}}});
    return()=>{if(chartInst.current)chartInst.current.destroy();};
  },[clients.length]);
  return <div style={{...card,padding:"1.25rem",marginBottom:"1.5rem"}}>
    <div style={{display:"flex",justifyContent:"space-between",marginBottom:"1rem",flexWrap:"wrap",gap:8}}>
      <p style={{fontSize:13,fontWeight:500,margin:0}}>📊 Funil de implantação</p>
      <span style={{fontSize:12,color:"#9CA3AF"}}>{clients.length} cliente(s)</span>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:"1.25rem"}}>
      {dados.map(d=><div key={d.stageId} style={{background:d.bg,border:"1px solid "+d.color+"33",borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
        <p style={{fontSize:24,fontWeight:700,color:d.color,margin:"0 0 2px"}}>{d.total}</p>
        <p style={{fontSize:11,color:d.color,margin:"0 0 6px",fontWeight:500,lineHeight:1.3}}>{d.label}</p>
        <div style={{background:"rgba(0,0,0,.08)",borderRadius:4,height:4,overflow:"hidden"}}>
          <div style={{height:4,background:d.color,width:Math.round(d.total/total*100)+"%",borderRadius:4}}/>
        </div>
        <p style={{fontSize:10,color:d.color,margin:"3px 0 0"}}>{Math.round(d.total/clients.length*100||0)}%</p>
      </div>)}
    </div>
    <div style={{height:200,position:"relative"}}><canvas ref={chartRef}/></div>
  </div>;
}

function BaseConhecimentoPage({session,onBack}){
  const [busca,setBusca]=React.useState("");
  const [cat,setCat]=React.useState("todos");
  const [iaQuery,setIaQuery]=React.useState("");
  const [iaResp,setIaResp]=React.useState("");
  const [iaLoading,setIaLoading]=React.useState(false);
  const [artSel,setArtSel]=React.useState(null);

  const artigos=KB_ARTIGOS.filter(a=>
    (cat==="todos"||a.cat===cat)&&
    (!busca||[a.titulo,a.resumo].join(" ").toLowerCase().includes(busca.toLowerCase()))
  );

  const temVideo=a=>a.video&&a.video.includes("drive.google.com");

  async function buscarIA(){
    if(!iaQuery.trim())return;
    setIaLoading(true);setIaResp("");
    const ctx=KB_ARTIGOS.slice(0,80).map(a=>`- ${a.titulo}: ${a.resumo}`).join("\n");
    try{
      const r=await fetch("/.netlify/functions/claude-proxy",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:600,
          system:"Você é o assistente de suporte do sistema Soft Tur. Responda em português de forma clara e direta com base na base de conhecimento abaixo. Se houver um artigo específico, mencione o título. Se não souber, diga para abrir um chamado no suporte.\n\nBase de conhecimento:\n"+ctx,
          messages:[{role:"user",content:iaQuery}],
        }),
      });
      const d=await r.json();
      const txt=d.content&&d.content[0]&&d.content[0].text||"Não foi possível obter resposta.";
      setIaResp(txt);

      // Destacar artigos relacionados
      const palavras=iaQuery.toLowerCase().split(" ").filter(p=>p.length>3);
      const relacionados=KB_ARTIGOS.filter(a=>palavras.some(p=>[a.titulo,a.resumo].join(" ").toLowerCase().includes(p))).slice(0,4);
      if(relacionados.length>0)setIaResp(prev=>prev+"\n\n__RELACIONADOS__:"+relacionados.map(a=>a.titulo).join("|"));
    }catch(e){setIaResp("Erro ao consultar IA: "+e.message);}
    setIaLoading(false);
  }

  // Parse resposta IA
  var iaTexto=iaResp,iaRel=[];
  if(iaResp.includes("__RELACIONADOS__:")){
    var pts=iaResp.split("__RELACIONADOS__:");
    iaTexto=pts[0];
    iaRel=(pts[1]||"").split("|").map(t=>KB_ARTIGOS.find(a=>a.titulo===t)).filter(Boolean);
  }

  return <div style={{padding:"1rem 0"}}>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:"1rem",flexWrap:"wrap"}}>
      <button style={bG} onClick={onBack}><i className="ti ti-arrow-left"/> Voltar</button>
      <div style={{flex:1}}>
        <p style={{fontWeight:700,fontSize:16,margin:0}}>📚 Base de Conhecimento</p>
        <p style={{fontSize:11,color:"#9CA3AF",margin:0}}>{KB_ARTIGOS.length} artigos · {KB_ARTIGOS.filter(a=>a.video).length} com vídeo</p>
      </div>
      <a href="https://soft-tur.tomticket.com/kb/treinamentos" target="_blank" style={{...bG,fontSize:12,textDecoration:"none",display:"flex",alignItems:"center",gap:5}}>
        <i className="ti ti-external-link"/>Ver no TomTicket
      </a>
    </div>

    {/* IA Search */}
    <div style={{...card,padding:"1rem 1.25rem",marginBottom:14,background:"linear-gradient(135deg,#1e1b4b,#312e81)",border:"none"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
        <div style={{width:32,height:32,borderRadius:"50%",background:"rgba(255,255,255,.15)",display:"flex",alignItems:"center",justifyContent:"center"}}>
          <i className="ti ti-robot" style={{fontSize:16,color:"#A5B4FC"}}/>
        </div>
        <div>
          <p style={{fontSize:13,fontWeight:700,color:"#fff",margin:0}}>Assistente IA — Busca Inteligente</p>
          <p style={{fontSize:11,color:"#A5B4FC",margin:0}}>Faça uma pergunta e a IA encontra o artigo certo</p>
        </div>
      </div>
      <div style={{display:"flex",gap:8}}>
        <input
          style={{flex:1,border:"1px solid rgba(255,255,255,.2)",borderRadius:8,padding:"10px 13px",fontSize:13,background:"rgba(255,255,255,.1)",color:"#fff",outline:"none",fontFamily:"'Inter',sans-serif"}}
          placeholder="Ex: como cancelar uma venda? como emitir nota fiscal?"
          value={iaQuery} onChange={e=>setIaQuery(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&buscarIA()}
        />
        <button onClick={buscarIA} disabled={iaLoading} style={{background:"#6366F1",border:"none",color:"#fff",borderRadius:8,padding:"10px 16px",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"'Inter',sans-serif",whiteSpace:"nowrap"}}>
          {iaLoading?<i className="ti ti-loader-2" style={{animation:"spin 1s linear infinite"}}/>:<><i className="ti ti-sparkles" style={{marginRight:5}}/>Perguntar</>}
        </button>
      </div>
      {(iaTexto||iaLoading)&&<div style={{marginTop:12,background:"rgba(255,255,255,.08)",borderRadius:8,padding:"12px 14px"}}>
        {iaLoading?<p style={{fontSize:13,color:"#A5B4FC",margin:0}}>🔍 Consultando base de conhecimento...</p>
        :<>
          <p style={{fontSize:13,color:"#E0E7FF",margin:"0 0 8px",lineHeight:1.7,whiteSpace:"pre-wrap"}}>{iaTexto}</p>
          {iaRel.length>0&&<div>
            <p style={{fontSize:11,color:"#A5B4FC",margin:"8px 0 5px",fontWeight:600,textTransform:"uppercase",letterSpacing:".04em"}}>📌 Artigos relacionados:</p>
            {iaRel.map((a,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 8px",background:"rgba(255,255,255,.07)",borderRadius:6,marginBottom:4,cursor:"pointer"}} onClick={()=>setArtSel(a)}>
              <i className={"ti "+(temVideo(a)?"ti-video":"ti-file-text")} style={{fontSize:13,color:"#A5B4FC",flexShrink:0}}/>
              <span style={{fontSize:12,color:"#E0E7FF",fontWeight:500}}>{a.titulo}</span>
            </div>)}
          </div>}
        </>}
      </div>}
    </div>

    {/* Filtro por texto */}
    <div style={{display:"flex",gap:8,marginBottom:10}}>
      <div style={{position:"relative",flex:1}}>
        <i className="ti ti-search" style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",fontSize:14,color:"#9CA3AF"}}/>
        <input style={{...inp,paddingLeft:32}} placeholder="Buscar por título ou palavra-chave..." value={busca} onChange={e=>setBusca(e.target.value)}/>
      </div>
      {busca&&<button style={{...bG,padding:"8px 12px",fontSize:12}} onClick={()=>setBusca("")}>✕</button>}
    </div>

    {/* Categorias */}
    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
      {KB_CATS.map(c=><button key={c.id} onClick={()=>setCat(c.id)} style={{border:cat===c.id?"2px solid #4F46E5":"1px solid #E5E7EB",background:cat===c.id?"#EEF2FF":"#fff",color:cat===c.id?"#4F46E5":"#6B7280",borderRadius:20,padding:"4px 12px",fontSize:11,fontWeight:600,cursor:"pointer"}}>
        {c.label} {c.id!=="todos"&&<span style={{fontSize:10,opacity:.7}}>({KB_ARTIGOS.filter(a=>a.cat===c.id).length})</span>}
      </button>)}
    </div>

    {/* Resultado */}
    <p style={{fontSize:12,color:"#9CA3AF",margin:"0 0 10px"}}>{artigos.length} artigo{artigos.length!==1?"s":""} encontrado{artigos.length!==1?"s":""}</p>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
      {artigos.map((a,i)=><div key={i} style={{...card,padding:"12px 14px",cursor:"pointer",borderLeft:"3px solid "+(temVideo(a)?"#DC2626":"#4F46E5")}} onClick={()=>setArtSel(a)}>
        <div style={{display:"flex",alignItems:"flex-start",gap:8}}>
          <div style={{width:28,height:28,borderRadius:6,background:temVideo(a)?"#FEF2F2":"#EEF2FF",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            <i className={"ti "+(temVideo(a)?"ti-video":"ti-file-text")} style={{fontSize:14,color:temVideo(a)?"#DC2626":"#4F46E5"}}/>
          </div>
          <div style={{flex:1,minWidth:0}}>
            <p style={{fontSize:12,fontWeight:600,margin:"0 0 3px",lineHeight:1.3,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{a.titulo}</p>
            <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
              <span style={{fontSize:10,background:"#F3F4F6",color:"#6B7280",padding:"1px 6px",borderRadius:3}}>{KB_CATS.find(c=>c.id===a.cat)?.label||a.cat}</span>
              {temVideo(a)&&<span style={{fontSize:10,background:"#FEF2F2",color:"#DC2626",padding:"1px 6px",borderRadius:3}}>📹 Vídeo</span>}
            </div>
          </div>
        </div>
      </div>)}
    </div>

    {artigos.length===0&&<div style={{...card,padding:"3rem",textAlign:"center"}}>
      <i className="ti ti-search-off" style={{fontSize:36,color:"#D1D5DB",display:"block",marginBottom:8}}/>
      <p style={{fontSize:13,color:"#9CA3AF"}}>Nenhum artigo encontrado para "{busca}".</p>
    </div>}

    {/* Modal Artigo */}
    {artSel&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",display:"flex",alignItems:"flex-start",justifyContent:"center",zIndex:300,padding:"20px 10px",overflowY:"auto"}}>
      <div style={{background:"#fff",borderRadius:14,width:"100%",maxWidth:580,boxShadow:"0 24px 64px rgba(0,0,0,.3)"}}>
        <div style={{background:temVideo(artSel)?"#DC2626":"#4F46E5",padding:"14px 18px",borderRadius:"14px 14px 0 0",display:"flex",alignItems:"flex-start",gap:10}}>
          <div style={{flex:1}}>
            <span style={{fontSize:10,background:"rgba(255,255,255,.2)",color:"#fff",padding:"2px 8px",borderRadius:4,display:"inline-block",marginBottom:6}}>{KB_CATS.find(c=>c.id===artSel.cat)?.label||artSel.cat}</span>
            <p style={{fontSize:15,fontWeight:700,color:"#fff",margin:0,lineHeight:1.3}}>{artSel.titulo}</p>
          </div>
          <button style={{background:"rgba(255,255,255,.15)",border:"none",color:"#fff",padding:"6px 10px",borderRadius:6,cursor:"pointer",fontSize:14,flexShrink:0}} onClick={()=>setArtSel(null)}>✕</button>
        </div>
        <div style={{padding:"20px 20px 24px"}}>
          <p style={{fontSize:14,color:"#374151",lineHeight:1.7,margin:"0 0 16px"}}>{artSel.resumo}</p>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <a href={artSel.url} target="_blank" style={{display:"flex",alignItems:"center",gap:6,background:"#4F46E5",color:"#fff",border:"none",borderRadius:8,padding:"10px 18px",fontSize:13,fontWeight:600,textDecoration:"none"}}>
              <i className="ti ti-external-link"/>Ver artigo completo
            </a>
            {temVideo(artSel)&&<a href={artSel.video} target="_blank" style={{display:"flex",alignItems:"center",gap:6,background:"#DC2626",color:"#fff",border:"none",borderRadius:8,padding:"10px 18px",fontSize:13,fontWeight:600,textDecoration:"none"}}>
              <i className="ti ti-player-play"/>Assistir vídeo
            </a>}
          </div>
          {temVideo(artSel)&&<div style={{marginTop:14,background:"#000",borderRadius:8,overflow:"hidden",position:"relative",paddingTop:"56.25%"}}>
            <iframe
              src={artSel.video.replace("/view","/preview").replace("?usp=sharing","").replace("?usp=drive_link","").replace("?pli=1","")}
              style={{position:"absolute",top:0,left:0,width:"100%",height:"100%",border:"none"}}
              allow="autoplay"
              title={artSel.titulo}
            />
          </div>}
        </div>
      </div>
    </div>}

    <style>{`@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}`}</style>
  </div>;
}

// ── TarefasPage ───────────────────────────────
const COLAB=["Douglas","Giliardi","Marcos","Financeiro","Suporte","Implantação","Desenvolvimento","Comercial","Bruna","Marcus","Pablo","Romulo","Thayna"];
const DEPTOS=["Suporte","Financeiro","Implantação","Desenvolvimento","Comercial","WhatsApp API","CRM"];
const STATUS_T=[
  {v:"Pendente",c:"#F59E0B",bg:"#FFFBEB"},
  {v:"Em andamento",c:"#185FA5",bg:"#EFF6FF"},
  {v:"Aguardando cliente",c:"#7C3AED",bg:"#F5F3FF"},
  {v:"Em análise",c:"#0891B2",bg:"#ECFEFF"},
  {v:"Em homologação",c:"#D97706",bg:"#FFFBEB"},
  {v:"Finalizado",c:"#16A34A",bg:"#DCFCE7"},
  {v:"Cancelado",c:"#6B7280",bg:"#F3F4F6"},
];
const PRIO_T=[
  {v:"Baixa",c:"#6B7280",bg:"#F3F4F6"},
  {v:"Média",c:"#185FA5",bg:"#EFF6FF"},
  {v:"Alta",c:"#D97706",bg:"#FFFBEB"},
  {v:"Crítica",c:"#DC2626",bg:"#FEF2F2"},
];
function loadTarefas(){try{return JSON.parse(localStorage.getItem("st_tarefas")||"[]");}catch(e){return [];}}
function saveTarefas(list){
  localStorage.setItem("st_tarefas",JSON.stringify(list));
  // Sincroniza com Supabase em background
  db.set("tarefas",list).catch(function(){});
}
function nextTaskId(list){const n=(list.length>0?Math.max(...list.map(t=>parseInt(t.id.split("-")[1]||0))):0)+1;return "TASK-"+String(n).padStart(4,"0");}

function TStatusBadge({v,sm}){
  const s=STATUS_T.find(x=>x.v===v)||STATUS_T[0];
  return <span style={{display:"inline-block",padding:sm?"2px 7px":"4px 10px",borderRadius:20,fontSize:sm?10:11,fontWeight:600,background:s.bg,color:s.c}}>{v}</span>;
}
function TPrioBadge({v,sm}){
  const s=PRIO_T.find(x=>x.v===v)||PRIO_T[0];
  return <span style={{display:"inline-flex",alignItems:"center",gap:3,padding:sm?"2px 7px":"4px 10px",borderRadius:20,fontSize:sm?10:11,fontWeight:600,background:s.bg,color:s.c}}>
    {v==="Crítica"&&"🔴"}{v==="Alta"&&"🟠"}{v==="Média"&&"🟡"}{v==="Baixa"&&"⚪"}{v}
  </span>;
}

function TarefasPage({session,clients,onBack}){
  const [tarefas,setTarefas]=React.useState(loadTarefas);
  React.useEffect(function(){
    db.get("tarefas").then(function(v){
      if(v&&Array.isArray(v)&&v.length>0){
        setTarefas(v);
        localStorage.setItem("st_tarefas",JSON.stringify(v));
      }
    }).catch(function(){});
  },[]);
  const [view,setView]=React.useState("dashboard"); // dashboard | lista | kanban
  const [modal,setModal]=React.useState(null); // null | "new" | "edit" | "detail"
  const [sel,setSel]=React.useState(null);
  const [form,setForm]=React.useState({});
  const [checkInput,setCheckInput]=React.useState("");
  const [comentInput,setComentInput]=React.useState("");
  const [addVinc,setAddVinc]=React.useState({tipo:"azure",id:"",titulo:""});
  const [vincLoading,setVincLoading]=React.useState(false);
  const [filtros,setFiltros]=React.useState({status:"",prioridade:"",responsavel:"",departamento:"",busca:""});
  const [erros,setErros]=React.useState({});

  function save(list){setTarefas(list);saveTarefas(list);}

  function criarTarefa(){
    var e={};
    if(!form.titulo)e.titulo="Obrigatório";
    if(!form.status)e.status="Obrigatório";
    if(!form.prioridade)e.prioridade="Obrigatório";
    if(Object.keys(e).length>0){setErros(e);return;}
    const agora={data:today(),hora:now()};
    if(modal==="new"){
      const t={...form,id:nextTaskId(tarefas),criadoPor:session.nome,criadoEm:agora.data+" "+agora.hora,checklist:form.checklist||[],comentarios:[],historico:[{...agora,usuario:session.nome,texto:"Tarefa criada"}]};
      const nl=[t,...tarefas];save(nl);
    } else {
      const t={...form,historico:[{...agora,usuario:session.nome,texto:"Tarefa atualizada"},...(sel.historico||[])]};
      save(tarefas.map(x=>x.id===t.id?t:x));setSel(t);
    }
    setModal(null);setForm({});setErros({});
  }

  function atualizarStatus(id,novoStatus){
    const agora={data:today(),hora:now()};
    const lista=tarefas.map(t=>{
      if(t.id!==id)return t;
      return {...t,status:novoStatus,historico:[{...agora,usuario:session.nome,texto:"Status: "+t.status+" → "+novoStatus},...(t.historico||[])]};
    });
    save(lista);if(sel&&sel.id===id)setSel(lista.find(t=>t.id===id));
  }

  function addComent(){
    if(!comentInput.trim())return;
    const agora={data:today(),hora:now()};
    const lista=tarefas.map(t=>t.id!==sel.id?t:{...t,comentarios:[{texto:comentInput,usuario:session.nome,...agora},...(t.comentarios||[])]});
    save(lista);setSel(lista.find(t=>t.id===sel.id));setComentInput("");
  }

  function toggleCheck(idx){
    const lista=tarefas.map(t=>{
      if(t.id!==sel.id)return t;
      var cl=[...(t.checklist||[])];cl[idx]={...cl[idx],feito:!cl[idx].feito};
      return {...t,checklist:cl};
    });
    save(lista);setSel(lista.find(t=>t.id===sel.id));
  }

  function addCheck(){
    if(!checkInput.trim())return;
    const lista=tarefas.map(t=>t.id!==sel.id?t:{...t,checklist:[...(t.checklist||[]),{texto:checkInput,feito:false}]});
    save(lista);setSel(lista.find(t=>t.id===sel.id));setCheckInput("");
  }

  function excluir(id){if(!confirm("Excluir tarefa?"))return;save(tarefas.filter(t=>t.id!==id));setModal(null);setSel(null);}

  async function salvarVincForm(){
    if(!addVinc.id.trim())return;
    setVincLoading(true);
    var id=addVinc.id.trim();
    var titulo=addVinc.titulo.trim();
    if(!titulo){
      try{
        if(addVinc.tipo==="azure"){
          var azCfg=await db.get("azure_cfg").catch(function(){return null;});
          if(azCfg&&azCfg.org&&azCfg.pat){
            var projs=Object.values(azCfg.projects||{}).filter(Boolean);
            var proj=projs[0]||azCfg.project||"";
            if(proj){
              var r=await fetch("/.netlify/functions/azure-proxy",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({org:azCfg.org,project:proj,pat:azCfg.pat,mode:"byIds",ids:[Number(id)]})});
              if(r.ok){var d=await r.json();if(Array.isArray(d)&&d[0])titulo=d[0].title||"";}
            }
          }
        } else {
          var ttTok=await db.get("tt_tok").catch(function(){return null;});
          if(ttTok){
            var r2=await fetch("/.netlify/functions/tomticket-proxy",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:ttTok,endpoint:"ticket/"+id,method:"GET",params:{}})});
            if(r2.ok){var d2=await r2.json();titulo=d2.title||d2.assunto||d2.subject||d2.name||"";}
          }
        }
      }catch(e){}
    }
    var vinc={tipo:addVinc.tipo,id:id,titulo:titulo,ajustado:null};
    setForm(function(p){return {...p,vinculados:[...(p.vinculados||[]),vinc]};});
    setAddVinc(function(p){return {...p,id:"",titulo:""};});
    setVincLoading(false);
  }
  async function salvarVinc(){
    if(!addVinc.id.trim())return;
    setVincLoading(true);
    var id=addVinc.id.trim();
    var titulo=addVinc.titulo.trim();
    if(!titulo){
      try{
        if(addVinc.tipo==="azure"){
          var azCfg=await db.get("azure_cfg").catch(function(){return null;});
          if(azCfg&&azCfg.org&&azCfg.pat){
            var projs=Object.values(azCfg.projects||{}).filter(Boolean);
            var proj=projs[0]||azCfg.project||"";
            if(proj){
              var r=await fetch("/.netlify/functions/azure-proxy",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({org:azCfg.org,project:proj,pat:azCfg.pat,mode:"byIds",ids:[Number(id)]})});
              if(r.ok){var d=await r.json();if(Array.isArray(d)&&d[0])titulo=d[0].title||"";}
            }
          }
        } else {
          var ttTok=await db.get("tt_tok").catch(function(){return null;});
          if(ttTok){
            var r2=await fetch("/.netlify/functions/tomticket-proxy",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:ttTok,endpoint:"ticket/"+id,method:"GET",params:{}})});
            if(r2.ok){var d2=await r2.json();titulo=d2.title||d2.assunto||d2.subject||d2.name||"";}
          }
        }
      }catch(e){}
    }
    var vinc={tipo:addVinc.tipo,id:id,titulo:titulo,ajustado:null};
    var lista=tarefas.map(function(x){if(x.id!==sel.id)return x;return {...x,vinculados:[...(x.vinculados||[]),vinc]};});
    save(lista);setSel(lista.find(function(x){return x.id===sel.id;}));
    setAddVinc(function(p){return {...p,id:"",titulo:""};});
    setVincLoading(false);
  }
  function toggleVincStatus(idx,val){
    var lista=tarefas.map(function(x){
      if(x.id!==sel.id)return x;
      var vv=[...(x.vinculados||[])];vv[idx]={...vv[idx],ajustado:vv[idx].ajustado===val?null:val};
      return {...x,vinculados:vv};
    });
    save(lista);setSel(lista.find(function(x){return x.id===sel.id;}));
  }
  function removerVinc(idx){
    var lista=tarefas.map(function(x){if(x.id!==sel.id)return x;var vv=(x.vinculados||[]).filter(function(_,i){return i!==idx;});return {...x,vinculados:vv};});
    save(lista);setSel(lista.find(function(x){return x.id===sel.id;}));
  }

  function notifWA(t){
    const msg="*Nova tarefa atribuída para você*\n\n📋 *Tarefa:* "+t.id+" — "+t.titulo+"\n📌 *Status:* "+t.status+"\n🔴 *Prioridade:* "+t.prioridade+(t.prazo?"\n⏰ *Prazo:* "+t.prazo:"")+(t.descricao?"\n📝 "+t.descricao.slice(0,120):"");
    window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
  }

  function notifEmail(t){
    var coResp=(t.coresponsaveis||[]).filter(Boolean).join(", ")||"-";
    var msg="TAREFA: "+t.id+"\nTítulo: "+t.titulo+"\nStatus: "+t.status+"\nPrioridade: "+t.prioridade+"\nResponsável: "+(t.responsavel||"-")+"\nCo-responsáveis: "+coResp+"\nDepartamento: "+(t.departamento||"-")+"\nPrazo: "+(t.prazo||"-")+(t.descricao?"\n\nDescrição:\n"+t.descricao:"");
    fetch("https://formspree.io/f/xlgveebz",{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({_subject:"[TAREFA] "+t.id+" — "+t.titulo,mensagem:msg,tarefa_id:t.id,status:t.status,prioridade:t.prioridade,responsavel:t.responsavel||"-"}),
    }).then(function(r){return r.json();}).then(function(r){
      if(r.ok||r.next){alert("✅ E-mail enviado com sucesso!");}
      else{alert("⚠️ Erro: "+JSON.stringify(r));}
    }).catch(function(e){alert("⚠️ Falha: "+e.message);});
  }

  const lista=tarefas.filter(t=>
    (!filtros.status||t.status===filtros.status)&&
    (!filtros.prioridade||t.prioridade===filtros.prioridade)&&
    (!filtros.responsavel||t.responsavel===filtros.responsavel)&&
    (!filtros.departamento||t.departamento===filtros.departamento)&&
    (!filtros.busca||[t.titulo,t.id,t.descricao].join(" ").toLowerCase().includes(filtros.busca.toLowerCase()))
  );

  const stats={total:tarefas.length,finalizadas:tarefas.filter(t=>t.status==="Finalizado").length,criticas:tarefas.filter(t=>t.prioridade==="Crítica"&&t.status!=="Finalizado"&&t.status!=="Cancelado").length,andamento:tarefas.filter(t=>t.status==="Em andamento").length,pendentes:tarefas.filter(t=>t.status==="Pendente").length};
  const agrupado=COLAB.map(c=>({nome:c,total:tarefas.filter(t=>t.responsavel===c).length,finalizadas:tarefas.filter(t=>t.responsavel===c&&t.status==="Finalizado").length})).filter(c=>c.total>0);

  const sf=v=>e=>setForm(p=>({...p,[v]:e.target.value}));
  const T={border:"1.5px solid #E5E7EB",borderRadius:8,padding:"9px 11px",fontSize:13,width:"100%",background:"#fff",outline:"none",fontFamily:"'Inter',sans-serif",color:"#374151",boxSizing:"border-box"};

  function openEdit(t){setSel(t);setForm({...t});setModal("edit");}
  function openDetail(t){setSel(t);setModal("detail");}

  return <div style={{padding:"1rem 0"}}>
    {/* Header */}
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:"1rem",flexWrap:"wrap"}}>
      <button style={bG} onClick={onBack}><i className="ti ti-arrow-left"/> Voltar</button>
      <div style={{flex:1}}>
        <p style={{fontWeight:700,fontSize:16,margin:0}}>🗂 Gestão de Tarefas</p>
        <p style={{fontSize:11,color:"#9CA3AF",margin:0}}>{tarefas.length} tarefa(s) registrada(s)</p>
      </div>
      <div style={{display:"flex",gap:6}}>
        {["dashboard","lista","kanban"].map(v=><button key={v} style={{...bG,padding:"6px 12px",background:view===v?"#111827":"",color:view===v?"#fff":"#374151",fontSize:12}} onClick={()=>setView(v)}>
          <i className={"ti "+(v==="dashboard"?"ti-layout-dashboard":v==="lista"?"ti-list":"ti-layout-columns")} style={{marginRight:4}}/>{v==="dashboard"?"Dashboard":v==="lista"?"Lista":"Kanban"}
        </button>)}
        <button style={{...bR,padding:"6px 14px",fontSize:12}} onClick={()=>{setForm({status:"Pendente",prioridade:"Média",checklist:[],criadoPor:session.nome});setModal("new");}}>
          <i className="ti ti-plus" style={{marginRight:4}}/>Nova Tarefa
        </button>
      </div>
    </div>

    {/* ─ DASHBOARD ─ */}
    {view==="dashboard"&&(function(){
      var selAtend=filtros.responsavel||"";
      var tarefasFilt=selAtend?tarefas.filter(function(t){return t.responsavel===selAtend;}):tarefas;
      var nomesAtend=[...new Set(tarefas.map(function(t){return t.responsavel||"";}).filter(Boolean))].sort();
      var atendentes=nomesAtend.map(function(nome){
        var ts=tarefas.filter(function(t){return t.responsavel===nome;});
        return {
          nome:nome,
          total:ts.length,
          pendente:ts.filter(function(t){return t.status==="Pendente";}).length,
          andamento:ts.filter(function(t){return t.status==="Em andamento";}).length,
          critica:ts.filter(function(t){return t.prioridade==="Crítica"&&t.status!=="Finalizado"&&t.status!=="Cancelado";}).length,
          finalizado:ts.filter(function(t){return t.status==="Finalizado";}).length,
          analise:ts.filter(function(t){return t.status==="Em análise"||t.status==="Em homologação"||t.status==="Aguardando cliente";}).length,
        };
      }).filter(function(a){return a.total>0;}).sort(function(a,b){return b.total-a.total;});
      var kpis=[
        {l:"Total",v:tarefasFilt.length,c:"#374151",bg:"#F3F4F6",ic:"ti-clipboard-list",status:""},
        {l:"Pendente",v:tarefasFilt.filter(function(t){return t.status==="Pendente";}).length,c:"#F59E0B",bg:"#FFFBEB",ic:"ti-clock",status:"Pendente"},
        {l:"Em andamento",v:tarefasFilt.filter(function(t){return t.status==="Em andamento";}).length,c:"#185FA5",bg:"#EFF6FF",ic:"ti-player-play",status:"Em andamento"},
        {l:"Críticas",v:tarefasFilt.filter(function(t){return t.prioridade==="Crítica"&&t.status!=="Finalizado"&&t.status!=="Cancelado";}).length,c:"#DC2626",bg:"#FEF2F2",ic:"ti-alert-triangle",status:"",prio:"Crítica"},
        {l:"Em análise",v:tarefasFilt.filter(function(t){return t.status==="Em análise";}).length,c:"#0891B2",bg:"#ECFEFF",ic:"ti-search",status:"Em análise"},
        {l:"Finalizadas",v:tarefasFilt.filter(function(t){return t.status==="Finalizado";}).length,c:"#16A34A",bg:"#DCFCE7",ic:"ti-circle-check",status:"Finalizado"},
      ];
      return <div>
        {/* KPI strip compacto */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:6,marginBottom:12}}>
          {kpis.map(function(x){return <div key={x.l} onClick={function(){setView("lista");setFiltros(function(p){return {...p,status:x.status,prioridade:x.prio||""};});}} style={{background:x.bg,border:"1px solid "+x.c+"33",borderRadius:8,padding:"8px 10px",cursor:"pointer",textAlign:"center",transition:"all .15s"}}>
            <i className={"ti "+x.ic} style={{fontSize:14,color:x.c,display:"block",marginBottom:2}}/>
            <p style={{fontSize:18,fontWeight:700,color:x.c,margin:"0 0 1px",lineHeight:1}}>{x.v}</p>
            <p style={{fontSize:9,color:x.c,margin:0,fontWeight:600,textTransform:"uppercase",letterSpacing:".03em",lineHeight:1.2}}>{x.l}</p>
          </div>;})}
        </div>

        {/* Layout split: Atendentes | Tarefas */}
        <div style={{display:"grid",gridTemplateColumns:"220px 1fr",gap:10,alignItems:"start"}}>

          {/* Coluna Atendentes */}
          <div style={{...card,padding:"10px 12px"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
              <p style={{fontSize:11,fontWeight:700,color:"#374151",margin:0,textTransform:"uppercase",letterSpacing:".04em"}}>👤 Atendentes</p>
              {selAtend&&<button onClick={function(){setFiltros(function(p){return {...p,responsavel:""};});}} style={{fontSize:9,color:"#9CA3AF",background:"none",border:"none",cursor:"pointer",padding:0}}>✕ limpar</button>}
            </div>
            {atendentes.length===0
              ?<p style={{fontSize:11,color:"#D1D5DB",textAlign:"center",padding:"12px 0",margin:0}}>Sem tarefas com<br/>responsável definido.</p>
              :atendentes.map(function(a){
                var sel2=selAtend===a.nome;
                var pct=a.total>0?Math.round(a.finalizado/a.total*100):0;
                return <div key={a.nome} onClick={function(){setFiltros(function(p){return {...p,responsavel:sel2?"":a.nome};});}} style={{padding:"8px 8px",borderRadius:8,marginBottom:4,cursor:"pointer",background:sel2?"#EFF6FF":"transparent",border:sel2?"1px solid #BFDBFE":"1px solid transparent",transition:"all .12s"}}>
                  <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:4}}>
                    <div style={{width:26,height:26,borderRadius:"50%",background:sel2?"#185FA5":"#E5E7EB",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontWeight:700,fontSize:11,color:sel2?"#fff":"#6B7280"}}>{a.nome[0]}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <p style={{fontSize:12,fontWeight:sel2?700:500,color:sel2?"#185FA5":"#374151",margin:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.nome}</p>
                      <p style={{fontSize:10,color:"#9CA3AF",margin:0}}>{a.total} tarefa{a.total!==1?"s":""} · {pct}% ok</p>
                    </div>
                  </div>
                  {/* mini status pills */}
                  <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
                    {a.pendente>0&&<span style={{fontSize:9,fontWeight:700,background:"#FFFBEB",color:"#F59E0B",borderRadius:8,padding:"1px 5px"}}>{a.pendente} pend</span>}
                    {a.andamento>0&&<span style={{fontSize:9,fontWeight:700,background:"#EFF6FF",color:"#185FA5",borderRadius:8,padding:"1px 5px"}}>{a.andamento} and</span>}
                    {a.critica>0&&<span style={{fontSize:9,fontWeight:700,background:"#FEF2F2",color:"#DC2626",borderRadius:8,padding:"1px 5px"}}>{a.critica} crit</span>}
                    {a.analise>0&&<span style={{fontSize:9,fontWeight:700,background:"#ECFEFF",color:"#0891B2",borderRadius:8,padding:"1px 5px"}}>{a.analise} anál</span>}
                    {a.finalizado>0&&<span style={{fontSize:9,fontWeight:700,background:"#DCFCE7",color:"#16A34A",borderRadius:8,padding:"1px 5px"}}>{a.finalizado} ok</span>}
                  </div>
                  {/* progress bar */}
                  <div style={{background:"#F3F4F6",borderRadius:10,height:3,marginTop:5}}>
                    <div style={{background:pct===100?"#16A34A":sel2?"#185FA5":"#94A3B8",borderRadius:10,height:3,width:pct+"%",transition:"width .3s"}}/>
                  </div>
                </div>;
              })
            }
          </div>

          {/* Coluna Tarefas */}
          <div style={{...card,padding:"10px 12px"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
              <p style={{fontSize:11,fontWeight:700,color:"#374151",margin:0,textTransform:"uppercase",letterSpacing:".04em"}}>
                {selAtend?<><span style={{color:"#185FA5"}}>{selAtend}</span> — tarefas</>:"📋 Todas as tarefas"}
              </p>
              <span style={{fontSize:10,color:"#9CA3AF"}}>{tarefasFilt.length} registro{tarefasFilt.length!==1?"s":""}</span>
            </div>
            {/* Tabela compacta */}
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                <thead>
                  <tr style={{background:"#F9FAFB",borderBottom:"1px solid #E5E7EB"}}>
                    {["ID","Título","Status","Prioridade","Responsável","Prazo"].map(function(h){return <th key={h} style={{padding:"5px 8px",textAlign:"left",fontSize:10,fontWeight:700,color:"#6B7280",textTransform:"uppercase",letterSpacing:".04em",whiteSpace:"nowrap"}}>{h}</th>;})}
                  </tr>
                </thead>
                <tbody>
                  {tarefasFilt.length===0
                    ?<tr><td colSpan={6} style={{padding:"20px",textAlign:"center",color:"#D1D5DB",fontSize:12}}>Nenhuma tarefa.</td></tr>
                    :tarefasFilt.map(function(t,i){
                      var st=STATUS_T.find(function(s){return s.v===t.status;})||STATUS_T[0];
                      var pr=PRIO_T.find(function(s){return s.v===t.prioridade;})||PRIO_T[0];
                      var venc=t.prazo&&new Date(t.prazo)<new Date()&&t.status!=="Finalizado";
                      return <tr key={t.id} onClick={function(){openDetail(t);}} style={{borderBottom:"1px solid #F9FAFB",cursor:"pointer",background:i%2===0?"#fff":"#FAFAFA",transition:"background .1s"}}
                        onMouseEnter={function(e){e.currentTarget.style.background="#EFF6FF";}}
                        onMouseLeave={function(e){e.currentTarget.style.background=i%2===0?"#fff":"#FAFAFA";}}>
                        <td style={{padding:"6px 8px",fontWeight:700,color:"#9CA3AF",fontSize:10,whiteSpace:"nowrap"}}>{t.id}</td>
                        <td style={{padding:"6px 8px",maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontWeight:500,color:"#374151"}}>{t.titulo}</td>
                        <td style={{padding:"6px 8px",whiteSpace:"nowrap"}}><span style={{fontSize:10,fontWeight:700,background:st.bg,color:st.c,borderRadius:10,padding:"2px 7px"}}>{t.status}</span></td>
                        <td style={{padding:"6px 8px",whiteSpace:"nowrap"}}><span style={{fontSize:10,fontWeight:700,background:pr.bg,color:pr.c,borderRadius:10,padding:"2px 7px"}}>{t.prioridade}</span></td>
                        <td style={{padding:"6px 8px",color:"#6B7280",whiteSpace:"nowrap",maxWidth:100,overflow:"hidden",textOverflow:"ellipsis"}}>{t.responsavel||"—"}</td>
                        <td style={{padding:"6px 8px",whiteSpace:"nowrap",color:venc?"#DC2626":"#6B7280",fontWeight:venc?700:400,fontSize:11}}>{t.prazo?new Date(t.prazo).toLocaleDateString("pt-BR"):"—"}</td>
                      </tr>;
                    })
                  }
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>;
    })()}

    {/* ─ LISTA ─ */}
    {view==="lista"&&<div>
      {/* Filtros */}
      <div style={{...card,padding:"12px 14px",marginBottom:12}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
          <input style={{...T,padding:"8px 10px"}} placeholder="🔍 Buscar tarefa..." value={filtros.busca} onChange={e=>setFiltros(p=>({...p,busca:e.target.value}))}/>
          <select style={{...T,padding:"8px 10px"}} value={filtros.status} onChange={e=>setFiltros(p=>({...p,status:e.target.value}))}>
            <option value="">Todos os status</option>
            {STATUS_T.map(s=><option key={s.v} value={s.v}>{s.v}</option>)}
          </select>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
          <select style={{...T,padding:"8px 10px"}} value={filtros.prioridade} onChange={e=>setFiltros(p=>({...p,prioridade:e.target.value}))}>
            <option value="">Todas prioridades</option>
            {PRIO_T.map(s=><option key={s.v} value={s.v}>{s.v}</option>)}
          </select>
          <select style={{...T,padding:"8px 10px"}} value={filtros.responsavel} onChange={e=>setFiltros(p=>({...p,responsavel:e.target.value}))}>
            <option value="">Todos colaboradores</option>
            {COLAB.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <select style={{...T,padding:"8px 10px"}} value={filtros.departamento} onChange={e=>setFiltros(p=>({...p,departamento:e.target.value}))}>
            <option value="">Todos departamentos</option>
            {DEPTOS.map(d=><option key={d} value={d}>{d}</option>)}
          </select>
        </div>
        {(filtros.status||filtros.prioridade||filtros.responsavel||filtros.departamento||filtros.busca)&&<button style={{...bG,fontSize:11,marginTop:8,padding:"4px 10px"}} onClick={()=>setFiltros({status:"",prioridade:"",responsavel:"",departamento:"",busca:""})}>✕ Limpar filtros ({lista.length} resultado{lista.length!==1?"s":""})</button>}
      </div>
      {lista.length===0?<div style={{...card,padding:"3rem",textAlign:"center"}}><i className="ti ti-clipboard-off" style={{fontSize:36,color:"#D1D5DB",display:"block",marginBottom:8}}/><p style={{fontSize:13,color:"#9CA3AF"}}>Nenhuma tarefa encontrada.</p></div>
      :lista.map(t=><div key={t.id} style={{...card,padding:"12px 14px",marginBottom:8,cursor:"pointer",borderLeft:"3px solid "+(PRIO_T.find(p=>p.v===t.prioridade)||PRIO_T[0]).c}} onClick={()=>openDetail(t)}>
        <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:4}}>
              <span style={{fontSize:10,fontWeight:700,color:"#9CA3AF",background:"#F3F4F6",padding:"1px 6px",borderRadius:4}}>{t.id}</span>
              <TStatusBadge v={t.status} sm/>
              <TPrioBadge v={t.prioridade} sm/>
            </div>
            <p style={{fontSize:14,fontWeight:600,margin:"0 0 3px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.titulo}</p>
            {t.descricao&&<p style={{fontSize:12,color:"#6B7280",margin:"0 0 4px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.descricao}</p>}
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
              {t.responsavel&&<span style={{fontSize:11,color:"#374151"}}><i className="ti ti-user" style={{marginRight:3,fontSize:10}}/>{t.responsavel}</span>}
              {t.departamento&&<span style={{fontSize:11,color:"#374151"}}><i className="ti ti-building" style={{marginRight:3,fontSize:10}}/>{t.departamento}</span>}
              {t.prazo&&<span style={{fontSize:11,color:"#C91B1B"}}><i className="ti ti-clock" style={{marginRight:3,fontSize:10}}/>{t.prazo}</span>}
              {(t.checklist||[]).length>0&&<span style={{fontSize:11,color:"#16A34A"}}><i className="ti ti-checkbox" style={{marginRight:3,fontSize:10}}/>{(t.checklist||[]).filter(c=>c.feito).length}/{(t.checklist||[]).length}</span>}
            </div>
          </div>
          <div style={{display:"flex",gap:5,flexShrink:0}} onClick={e=>e.stopPropagation()}>
            <button style={{...bG,padding:"5px 8px",fontSize:11}} onClick={()=>openEdit(t)}><i className="ti ti-edit"/></button>
            <button style={{...bG,padding:"5px 8px",fontSize:11,color:"#DC2626"}} onClick={()=>excluir(t.id)}><i className="ti ti-trash"/></button>
          </div>
        </div>
      </div>)}
    </div>}

    {/* ─ KANBAN ─ */}
    {view==="kanban"&&<div style={{overflowX:"auto",paddingBottom:8}}>
      <div style={{display:"flex",gap:10,minWidth:700}}>
        {STATUS_T.map(st=>{
          const col=tarefas.filter(t=>t.status===st.v);
          return <div key={st.v} style={{flex:1,minWidth:180,background:"#F9FAFB",borderRadius:10,padding:"10px 8px",border:"1px solid #F3F4F6"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
              <span style={{fontSize:11,fontWeight:700,color:st.c,textTransform:"uppercase",letterSpacing:".04em"}}>{st.v}</span>
              <span style={{fontSize:11,background:st.bg,color:st.c,borderRadius:10,padding:"1px 7px",fontWeight:700}}>{col.length}</span>
            </div>
            {col.map(t=><div key={t.id} style={{background:"#fff",borderRadius:8,padding:"10px 10px",marginBottom:6,boxShadow:"0 1px 4px rgba(0,0,0,.06)",cursor:"pointer",borderLeft:"3px solid "+(PRIO_T.find(p=>p.v===t.prioridade)||PRIO_T[0]).c}} onClick={()=>openDetail(t)}>
              <p style={{fontSize:11,color:"#9CA3AF",margin:"0 0 3px",fontWeight:700}}>{t.id}</p>
              <p style={{fontSize:13,fontWeight:600,margin:"0 0 4px",lineHeight:1.3}}>{t.titulo}</p>
              {t.responsavel&&<p style={{fontSize:11,color:"#6B7280",margin:"0 0 3px"}}>{t.responsavel}</p>}
              {t.prazo&&<p style={{fontSize:10,color:"#C91B1B",margin:0}}><i className="ti ti-clock" style={{marginRight:2}}/>{ t.prazo}</p>}
              <TPrioBadge v={t.prioridade} sm/>
            </div>)}
          </div>;
        })}
      </div>
    </div>}

    {/* ─ MODAL CRIAR/EDITAR ─ */}
    {(modal==="new"||modal==="edit")&&<Modal title={modal==="new"?"Nova Tarefa":"Editar Tarefa — "+form.id} onClose={()=>{setModal(null);setForm({});setErros({});}}>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <div>
          <label style={{fontSize:11,fontWeight:600,color:"#6B7280",display:"block",marginBottom:4}}>TÍTULO <span style={{color:"#DC2626"}}>*</span></label>
          <input style={{...T,borderColor:erros.titulo?"#DC2626":"#E5E7EB"}} placeholder="Ex: Corrigir integração TEF" value={form.titulo||""} onChange={sf("titulo")}/>
          {erros.titulo&&<p style={{fontSize:11,color:"#DC2626",margin:"3px 0 0"}}>{erros.titulo}</p>}
        </div>
        <div>
          <label style={{fontSize:11,fontWeight:600,color:"#6B7280",display:"block",marginBottom:4}}>DESCRIÇÃO</label>
          <textarea style={{...T,minHeight:70,resize:"vertical",lineHeight:1.5}} placeholder="Detalhamento completo da tarefa..." value={form.descricao||""} onChange={sf("descricao")}/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <div>
            <label style={{fontSize:11,fontWeight:600,color:"#6B7280",display:"block",marginBottom:4}}>STATUS <span style={{color:"#DC2626"}}>*</span></label>
            <select style={{...T,borderColor:erros.status?"#DC2626":"#E5E7EB"}} value={form.status||""} onChange={sf("status")}>
              <option value="">Selecione</option>
              {STATUS_T.map(s=><option key={s.v} value={s.v}>{s.v}</option>)}
            </select>
          </div>
          <div>
            <label style={{fontSize:11,fontWeight:600,color:"#6B7280",display:"block",marginBottom:4}}>PRIORIDADE <span style={{color:"#DC2626"}}>*</span></label>
            <select style={{...T,borderColor:erros.prioridade?"#DC2626":"#E5E7EB"}} value={form.prioridade||""} onChange={sf("prioridade")}>
              <option value="">Selecione</option>
              {PRIO_T.map(s=><option key={s.v} value={s.v}>{s.v}</option>)}
            </select>
          </div>
        </div>
        <div style={{background:"#F9FAFB",borderRadius:10,padding:"10px 12px",border:"1px solid #E5E7EB"}}>
          <label style={{fontSize:11,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:".04em",display:"block",marginBottom:8}}>
            <i className="ti ti-user-check" style={{marginRight:5,color:"#C91B1B"}}/>Responsável Principal
          </label>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            <div>
              <label style={{fontSize:10,color:"#9CA3AF",display:"block",marginBottom:3}}>NOME</label>
              <input style={{...T,fontSize:13}} placeholder="Nome completo" value={form.responsavel||""} onChange={sf("responsavel")}/>
            </div>
            <div>
              <label style={{fontSize:10,color:"#9CA3AF",display:"block",marginBottom:3}}>DEPARTAMENTO</label>
              <select style={{...T,fontSize:13}} value={form.departamento||""} onChange={sf("departamento")}>
                <option value="">Selecione</option>
                {DEPTOS.map(d=><option key={d} value={d}>{d}</option>)}
              </select>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            <div>
              <label style={{fontSize:10,color:"#9CA3AF",display:"block",marginBottom:3}}>E-MAIL</label>
              <input style={{...T,fontSize:13}} type="email" placeholder="email@empresa.com" value={form.responsavelEmail||""} onChange={sf("responsavelEmail")}/>

                <i className="ti ti-mail" style={{marginRight:5}}/>Notificar via E-mail

              })()} target="_blank" style={{display:"flex",alignItems:"center",justifyContent:"center",gap:5,padding:"9px 0",fontSize:12,color:"#EA4335",border:"1px solid #EA4335",borderRadius:8,fontWeight:600,textDecoration:"none",background:"#fff"}}>
                <i className="ti ti-calendar-event" style={{fontSize:14}}/>Adicionar ao Google Agenda
              </a>}

              <p style={{fontSize:11,fontWeight:600,color:"#9CA3AF",margin:"0 0 8px",textTransform:"uppercase",letterSpacing:".04em"}}>☑ Checklist {checkTotal>0&&<span style={{color:"#16A34A"}}>({checkFeitos}/{checkTotal})</span>}</p>

                <span style={{fontSize:13,color:c.feito?"#9CA3AF":"#374151",textDecoration:c.feito?"line-through":"none"}}>{c.texto}</span>

              <div style={{display:"flex",gap:6,marginTop:8}}>

                <button style={{...bG,padding:"6px 10px",fontSize:12}} onClick={addCheck}>+</button>

            {/* Comentários */}

              <p style={{fontSize:11,fontWeight:600,color:"#9CA3AF",margin:"0 0 8px",textTransform:"uppercase",letterSpacing:".04em"}}>💬 Comentários internos</p>

                <p style={{fontSize:13,color:"#374151",margin:0,lineHeight:1.5}}>{c.texto}</p>
              </div>)}
              <div style={{display:"flex",gap:6}}>
                <input style={{...T,flex:1,padding:"7px 10px",fontSize:12}} placeholder="Comentário técnico..." value={comentInput} onChange={e=>setComentInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addComent()}/>
                <button style={{...bR,padding:"6px 12px",fontSize:12}} onClick={addComent}>Enviar</button>
              </div>
            </div>

            {/* Histórico */}
            {(t.historico||[]).length>0&&<div>
              <p style={{fontSize:11,fontWeight:600,color:"#9CA3AF",margin:"0 0 8px",textTransform:"uppercase",letterSpacing:".04em"}}>📋 Histórico</p>
              {(t.historico||[]).map((h,i)=><div key={i} style={{display:"flex",gap:8,padding:"5px 0",borderBottom:"1px solid #F9FAFB"}}>
                <div style={{width:28,height:28,borderRadius:"50%",background:"#F3F4F6",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:11,fontWeight:700,color:"#374151"}}>{(h.usuario||"?")[0]}</div>
                <div style={{flex:1}}>
                  <p style={{fontSize:12,color:"#374151",margin:0}}>{h.texto}</p>
                  <p style={{fontSize:10,color:"#9CA3AF",margin:"1px 0 0"}}>{h.usuario} · {h.data} {h.hora}</p>
                </div>
              </div>)}
            </div>}
          </div>
        </div>
      </div>;
    })()}
  </div>;
}
